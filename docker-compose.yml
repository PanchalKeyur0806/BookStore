version: "3.9"
services:
  backendapp:
    container_name: backendapp
    build:
      context: ./
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    environment:
      - DB_STRING=mongodb://mongo:27017/BookStore
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  worker1:
    build:
      context: ./
    container_name: emailWorker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["node", "workers/emailWorker.js"]
    depends_on:
      - redis

  worker2:
    build:
      context: ./
    container_name: orderWorker
    environment:
      - DB_STRING=mongodb://mongo:27017/BookStores
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["node", "workers/orderWorker.js"]
    depends_on:
      - mongo
      - redis

  mongo:
    container_name: mongo
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    container_name: redis
    image: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PORT=6379

volumes:
  mongo_data:
