# schema.yaml

components:
  schemas:
    # ============================================================
    # COMMON SCHEMAS
    # ============================================================

    Address:
      type: object
      description: Physical address associated with a user.

      required:
        - street
        - city
        - state
        - zipCode
        - country

      properties:
        line:
          type: string
          description: Additional address information such as an area or locality.
          example: "vastral"

        street:
          type: string
          description: The user's street or road name.
          example: "Dakor"

        city:
          type: string
          description: The city where the user resides.
          example: "amdavad"

        state:
          type: string
          description: The state or province where the user resides.
          example: "guj"

        zipCode:
          type: integer
          description: Postal or ZIP code associated with the address.
          example: 382418

        country:
          type: string
          description: Country associated with the address.
          example: "ind"

    # ============================================================
    # AUTHENTICATION REQUEST SCHEMAS
    # ============================================================

    RegisterUserRequest:
      type: object
      description: Request payload used to create a new BookStore user account.

      required:
        - name
        - email
        - password
        - dateOfBirth
        - phoneNumber
        - gender
        - address

      properties:
        name:
          type: string
          minLength: 2
          description: The user's full name.
          example: "Panchal Keyur"

        email:
          type: string
          format: email
          description: Email address used for the user's account.
          example: "panchalkeyur.dev@gmail.com"

        password:
          type: string
          format: password
          minLength: 8
          description: Password used to authenticate the user.
          example: "hello-1234"

        dateOfBirth:
          type: string
          format: date
          description: The user's date of birth.
          example: "2005-06-08"

        phoneNumber:
          type: integer
          description: The user's 10-digit phone number.
          example: 1234567890

        gender:
          type: string
          enum:
            - male
            - female
            - others
          description: Gender selected by the user.
          example: "male"

        address:
          $ref: "#/components/schemas/Address"

    LoginRequest:
      type: object
      description: Request payload used to authenticate an existing user.

      required:
        - email
        - password

      properties:
        email:
          type: string
          format: email
          description: Email address associated with the user account.
          example: "hello-1@gmail.com"

        password:
          type: string
          format: password
          description: Password associated with the user account.
          example: "hello-1234"

    VerifyOtpRequest:
      type: object
      description: Request payload used to verify an OTP.

      required:
        - otp
        - email

      properties:
        otp:
          type: integer
          minimum: 100000
          maximum: 999999
          description: Six-digit OTP sent to the user's email.
          example: 151858

        email:
          type: string
          format: email
          description: Email address associated with the account.
          example: "panchalkeyur.dev@gmail.com"

    ResendOtpRequest:
      type: object
      description: Request payload used to request a new OTP.

      required:
        - email

      properties:
        email:
          type: string
          format: email
          description: Email address associated with the user account.
          example: "panchalkeyur.dev@gmail.com"

    ForgotPasswordRequest:
      type: object
      description: Request payload used to start the password reset process.

      required:
        - email

      properties:
        email:
          type: string
          format: email
          description: Email address associated with the account.
          example: "hello-1@gmail.com"

    ResetPasswordRequest:
      type: object
      description: Request payload used to set a new password.

      required:
        - password

      properties:
        password:
          type: string
          format: password
          minLength: 8
          description: New password that replaces the existing password.
          example: "hello-12345"

    # ============================================================
    # AUTHENTICATION RESPONSE SCHEMAS
    # ============================================================

    RegisterUserResponse:
      type: object
      description: Response returned after successfully registering a user.

      required:
        - status
        - message
        - data

      properties:
        status:
          type: string
          example: "success"

        message:
          type: string
          example: "user is registered, otp is being sent to email for verification"

        data:
          $ref: "#/components/schemas/User"

    LoginResponse:
      type: object
      description: Response returned after successful authentication.

      required:
        - status
        - token
        - data

      properties:
        status:
          type: string
          example: "success"

        token:
          type: string
          description: JWT access token.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

        data:
          $ref: "#/components/schemas/User"

    VerifyOtpResponse:
      type: object
      description: Response returned after successfully verifying an OTP.

      required:
        - status
        - message
        - token
        - data

      properties:
        status:
          type: string
          example: "success"

        message:
          type: string
          example: "otp verified successfully"

        token:
          type: string
          description: JWT access token.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

        data:
          $ref: "#/components/schemas/User"

    ResendOtpResponse:
      type: object
      description: Response returned after successfully sending a new OTP.

      required:
        - status
        - message

      properties:
        status:
          type: string
          example: "success"

        message:
          type: string
          example: "otp is sent to email, please check your email"

    ForgotPasswordResponse:
      type: object
      description: Response returned after successfully initiating password reset.

      required:
        - status
        - message

      properties:
        status:
          type: string
          example: "success"

        message:
          type: string
          example: "email send successfully"

    ResetPasswordResponse:
      type: object
      description: Response returned after successfully changing the password.

      required:
        - status
        - message

      properties:
        status:
          type: string
          example: "success"

        message:
          type: string
          example: "password chagned successfully"

    # ============================================================
    # USER
    # ============================================================

    User:
      type: object
      description: Represents a BookStore user account.

      properties:
        _id:
          type: string
          description: Unique identifier of the user.
          example: "683aa9c34ae6c56e60594eb2"

        name:
          type: string
          description: User's full name.
          example: "hello-1"

        email:
          type: string
          format: email
          description: User's email address.
          example: "hello-1@gmail.com"

        isEmailVerified:
          type: boolean
          description: Indicates whether the user's email has been verified.
          example: true

        role:
          type: string
          enum:
            - user
            - admin
          description: User's application role.
          example: "user"

        dateOfBirth:
          type: string
          format: date-time
          description: User's date of birth.
          example: "2005-06-08T00:00:00.000Z"

        phoneNumber:
          type: integer
          description: User's 10-digit phone number.
          example: 1234567890

        gender:
          type: string
          enum:
            - male
            - female
            - others
          example: "male"

        address:
          $ref: "#/components/schemas/Address"

        isActive:
          type: boolean
          description: Indicates whether the user account is active.
          example: true

        totalOrderes:
          type: integer
          minimum: 0
          description: Total number of orders placed by the user.
          example: 0

        totalSpent:
          type: number
          minimum: 0
          description: Total amount spent by the user.
          example: 0

        cart:
          type: array
          description: Items currently stored in the user's shopping cart.
          items:
            type: string
          example: []

        faviourites:
          type: array
          description: IDs of books added to the user's favourites.
          items:
            type: string
          example:
            - "6836a66013f0b230bee67c1f"
            - "683697c5c4efe00d7ca88e5a"

        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp.
          example: "2025-05-31T07:03:31.815Z"

        updatedAt:
          type: string
          format: date-time
          description: Last account update timestamp.
          example: "2025-05-31T07:03:31.815Z"

    # ============================================================
    # ERROR
    # ============================================================

    ErrorResponse:
      type: object
      description: Standard error response.

      required:
        - status
        - message

      properties:
        status:
          type: string
          example: "Error"

        message:
          type: string
          description: Human-readable explanation of the error.
          example: "please provide valid email address"

    # =========================================================
    # ADMIN SCHEMAS
    # =========================================================

    AdminDashboardResponse:
      type: object
      description: Statistics and inventory information used by the administrator dashboard.
      required:
        - status
        - salesData
        - userStats
        - orderStats
        - lowInventory
      properties:
        status:
          type: string
          description: Indicates whether the request was successful.
          example: "success"
        salesData:
          $ref: "#/components/schemas/AdminSalesData"
        userStats:
          $ref: "#/components/schemas/AdminUserStats"
        orderStats:
          $ref: "#/components/schemas/AdminOrderStats"
        lowInventory:
          type: array
          description: Books whose stock is at or below the low-inventory threshold.
          items:
            $ref: "#/components/schemas/LowInventoryBook"

    AdminSalesData:
      type: object
      description: Aggregated sales and revenue statistics.
      properties:
        totalRevenue:
          $ref: "#/components/schemas/RevenueStatistics"
        totalOrders:
          $ref: "#/components/schemas/CountStatistics"
        totalBooks:
          $ref: "#/components/schemas/CountStatistics"
        monthlyTotal:
          $ref: "#/components/schemas/SalesPeriodStatistics"
        yearlyTotal:
          $ref: "#/components/schemas/SalesPeriodStatistics"
        dailySales:
          type: array
          description: Daily paid sales for the last 30 days.
          items:
            $ref: "#/components/schemas/DailySales"
        topBook:
          $ref: "#/components/schemas/TopBook"

    RevenueStatistics:
      type: object
      description: Total revenue generated from applicable orders.
      properties:
        total:
          type: number
          format: double
          description: Total revenue amount.
          example: 125000

    CountStatistics:
      type: object
      description: A simple aggregate count.
      properties:
        count:
          type: integer
          description: Number of records.
          example: 250
        total:
          type: integer
          description: Total count of records.
          example: 250

    SalesPeriodStatistics:
      type: object
      description: Sales amount and order count for a specific period.
      properties:
        total:
          type: number
          format: double
          description: Total sales amount during the period.
          example: 18500
        count:
          type: integer
          description: Number of paid orders during the period.
          example: 42

    DailySales:
      type: object
      description: Sales statistics for a single day.
      required:
        - date
        - sales
        - count
      properties:
        date:
          type: string
          format: date
          description: Date for which the sales were recorded.
          example: "2026-09-27"
        sales:
          type: number
          format: double
          description: Total sales generated on the date.
          example: 1250
        count:
          type: integer
          description: Number of paid orders on the date.
          example: 5

    TopBook:
      type: object
      description: Best-selling book based on the number of units sold.
      properties:
        bookId:
          type: string
          description: Unique identifier of the book.
          example: "6ab8c6b4deb5c92fda07308a"
        title:
          type: string
          description: Title of the best-selling book.
          example: "Clean Code"
        totalSold:
          type: integer
          description: Total number of units sold.
          example: 45
        revenue:
          type: number
          format: double
          description: Revenue associated with the book.
          example: 13500

    AdminUserStats:
      type: object
      description: User registration and role statistics.
      properties:
        totalUsers:
          $ref: "#/components/schemas/CountStatistics"
        newUserThisMonth:
          $ref: "#/components/schemas/CountStatistics"
        userByRoles:
          type: array
          description: Number of users grouped by their role.
          items:
            $ref: "#/components/schemas/UserRoleStatistics"

    UserRoleStatistics:
      type: object
      description: Number of users belonging to a specific role.
      required:
        - role
        - count
      properties:
        role:
          type: string
          description: User role.
          example: "user"
        count:
          type: integer
          description: Number of users with this role.
          example: 420

    AdminOrderStats:
      type: object
      description: Statistics about order statuses.
      properties:
        orderByStatus:
          type: array
          description: Number of orders grouped by their current status.
          items:
            $ref: "#/components/schemas/OrderStatusStatistics"
        pendingOrders:
          $ref: "#/components/schemas/CountStatistics"

    OrderStatusStatistics:
      type: object
      description: Number of orders having a specific order status.
      required:
        - orderStatus
        - count
      properties:
        orderStatus:
          type: string
          description: Current status of the orders.
          example: "paid"
        count:
          type: integer
          description: Number of orders with this status.
          example: 210

    LowInventoryBook:
      type: object
      description: Book with stock at or below the low-inventory threshold.
      required:
        - title
        - author
        - stock
      properties:
        title:
          type: string
          description: Title of the book.
          example: "Clean Code"
        author:
          type: string
          description: Author of the book.
          example: "Robert C. Martin"
        stock:
          type: integer
          description: Number of copies currently available in inventory.
          example: 5

    # =========================================================
    # PAGINATION REUSABLE SCHEMA
    # =========================================================

    PaginationMetadata:
      type: object
      description: Pagination information returned with paginated admin queries.
      required:
        - totalItems
        - currentPage
        - hasNextPage
      properties:
        totalItems:
          type: integer
          description: Total number of items matching the query.
          example: 50
        totalPages:
          type: integer
          description: Total number of pages available.
          example: 5
        totalPage:
          type: integer
          description: Total number of pages available (alias used in some responses).
          example: 5
        currentPage:
          type: integer
          description: Current active page number.
          example: 1
        hasNextPage:
          type: boolean
          description: Indicates whether a subsequent page is available.
          example: true

    # =========================================================
    # SALES ANALYTICS SCHEMAS
    # =========================================================

    SalesAnalyticsItem:
      type: object
      description: Sales metrics aggregated for a specific time interval.
      required:
        - _id
        - totalRevenue
        - avgRevenue
        - totalOrders
        - totalItems
      properties:
        _id:
          type: string
          description: Formatted date bucket (e.g. YYYY-MM-DD, YYYY-Www, or YYYY-MM depending on groupBy).
          example: "2026-10-01"
        totalRevenue:
          type: number
          format: double
          description: Total revenue generated in this bucket from non-cancelled orders.
          example: 4500
        avgRevenue:
          type: number
          format: double
          description: Average order value in this bucket.
          example: 450
        totalOrders:
          type: integer
          description: Count of non-cancelled orders in this bucket.
          example: 10
        totalItems:
          type: integer
          description: Total quantity of book items sold across orders in this bucket.
          example: 15

    SalesAnalyticsResponse:
      type: object
      description: Response payload containing sales analytics grouped by time period.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: "success"
        data:
          type: array
          description: Time-series sales analytics entries.
          items:
            $ref: "#/components/schemas/SalesAnalyticsItem"

    # =========================================================
    # BOOK ANALYTICS SCHEMAS
    # =========================================================

    BookInventoryOverview:
      type: object
      description: Stock and catalog distribution summary across books.
      required:
        - total
        - totalActiveBooks
        - totalInactiveBooks
        - outOfStockBooks
        - lowStockBooks
      properties:
        total:
          type: integer
          description: Total books in catalog.
          example: 120
        totalActiveBooks:
          type: integer
          description: Number of active books (isDeleted != true).
          example: 110
        totalInactiveBooks:
          type: integer
          description: Number of deleted or inactive books.
          example: 10
        outOfStockBooks:
          type: integer
          description: Books with zero inventory remaining.
          example: 5
        lowStockBooks:
          type: integer
          description: Books with stock fewer than 100 units.
          example: 22

    BookSalesRankingItem:
      type: object
      description: Sales performance ranking entry for a book.
      required:
        - _id
        - totalSold
        - totalOrders
      properties:
        _id:
          type: string
          description: Unique identifier of the book.
          example: "664b1f89e21b8c12a8901234"
        totalSold:
          type: integer
          description: Total units sold across paid orders.
          example: 85
        totalOrders:
          type: integer
          description: Total count of paid orders containing this book.
          example: 42
        book:
          type: array
          description: Populated book document details from database lookup.
          items:
            type: object

    BookReviewRankingItem:
      type: object
      description: Review rating ranking entry for a book.
      required:
        - bookId
        - totalRating
        - reviewCount
        - avgRating
      properties:
        bookId:
          type: string
          description: Unique identifier of the reviewed book.
          example: "664b1f89e21b8c12a8901234"
        totalRating:
          type: number
          description: Cumulative sum of ratings.
          example: 245
        reviewCount:
          type: integer
          description: Total number of customer reviews.
          example: 52
        avgRating:
          type: number
          format: double
          description: Average rating score (1 to 5).
          example: 4.71

    BookAnalyticsData:
      type: object
      description: Detailed breakdown of book inventory, sales rankings, and review statistics.
      required:
        - booksAnalytic
        - bookSaleAnalytics
        - bookReviewAnalytics
      properties:
        booksAnalytic:
          type: array
          description: Aggregate book inventory metrics.
          items:
            $ref: "#/components/schemas/BookInventoryOverview"
        bookSaleAnalytics:
          type: array
          description: Top 10 best-selling and top 10 low-selling book rankings.
          items:
            type: object
            properties:
              bestSellingBooks:
                type: array
                items:
                  $ref: "#/components/schemas/BookSalesRankingItem"
              lowSellingBooks:
                type: array
                items:
                  $ref: "#/components/schemas/BookSalesRankingItem"
        bookReviewAnalytics:
          type: array
          description: Top 10 most-rated and top 10 highest-rated book rankings.
          items:
            type: object
            properties:
              mostRatedBook:
                type: array
                items:
                  $ref: "#/components/schemas/BookReviewRankingItem"
              highestRatedBook:
                type: array
                items:
                  $ref: "#/components/schemas/BookReviewRankingItem"

    BookAnalyticsResponse:
      type: object
      description: Response payload for comprehensive catalog analytics.
      required:
        - data
      properties:
        status:
          type: string
          example: "success"
        stauts:
          type: string
          description: Response status key returned by the controller.
          example: "success"
        data:
          $ref: "#/components/schemas/BookAnalyticsData"

    # =========================================================
    # DEAD MOVING STOCK SCHEMAS
    # =========================================================

    DeadStockBook:
      type: object
      description: Details of a book with zero sales over the preceding 30 days.
      required:
        - _id
        - title
        - stock
        - author
        - price
        - totalSold
      properties:
        _id:
          type: string
          description: Unique identifier of the book.
          example: "664b1f89e21b8c12a8901234"
        title:
          type: string
          example: "Legacy Architecture in Practice"
        stock:
          type: integer
          description: Number of copies currently in stock.
          example: 40
        author:
          type: string
          example: "Martin Fowler"
        price:
          type: number
          format: double
          example: 49.99
        totalSold:
          type: integer
          description: Copies sold in last 30 days (0 for dead stock).
          example: 0

    DeadStockResponse:
      type: object
      description: Paginated response listing dead moving inventory items.
      required:
        - status
        - data
        - pagination
      properties:
        status:
          type: string
          example: "success"
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeadStockBook"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"

    # =========================================================
    # BOOK PERFORMANCE SCHEMAS
    # =========================================================

    BookPerformanceItem:
      type: object
      description: Comprehensive performance profile for an individual book.
      required:
        - _id
        - title
        - author
        - price
        - stock
        - category
        - orderAnalytics
        - wishlistAnalytics
        - bookRating
      properties:
        _id:
          type: string
          description: Unique book identifier.
          example: "664b1f89e21b8c12a8901234"
        title:
          type: string
          example: "Clean Code"
        author:
          type: string
          example: "Robert C. Martin"
        price:
          type: number
          example: 450
        stock:
          type: integer
          example: 25
        category:
          type: string
          example: "Action"
        orderAnalytics:
          type: array
          description: Lifetime sales count and revenue generated from paid orders.
          items:
            type: object
            properties:
              totalSold:
                type: integer
                example: 15
              totalRevenue:
                type: number
                format: double
                example: 6750
        wishlistAnalytics:
          type: array
          description: Total wishlist inclusions for this book.
          items:
            type: object
            properties:
              totalWishlistCount:
                type: integer
                example: 8
        bookRating:
          type: array
          description: Average review rating.
          items:
            type: object
            properties:
              averageRating:
                type: number
                format: double
                example: 4.5

    BookPerformanceResponse:
      type: object
      description: Paginated response listing performance statistics for all books.
      required:
        - status
        - pagination
        - data
      properties:
        status:
          type: string
          example: "success"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
        data:
          type: array
          items:
            $ref: "#/components/schemas/BookPerformanceItem"

    # =========================================================
    # CATEGORY SALES & TREND SCHEMAS
    # =========================================================

    CategoryRevenueItem:
      type: object
      description: Aggregated sales units and revenue for a specific book category.
      required:
        - category
        - getSales
        - getRevenue
      properties:
        category:
          type: string
          description: Book category name.
          enum:
            - Fantasy
            - Action
            - Adventure
            - Mystery
            - Horror
            - Thriller
            - Romance
            - Self-help
            - Biography
          example: "Fantasy"
        getSales:
          type: integer
          description: Total items sold in this category.
          example: 120
        getRevenue:
          type: number
          format: double
          description: Total revenue generated in this category.
          example: 48000

    CategoryRevenueResponse:
      type: object
      description: Response payload containing sales and revenue grouped across all categories.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: "success"
        data:
          type: array
          items:
            $ref: "#/components/schemas/CategoryRevenueItem"

    CategoryTrendItem:
      type: object
      description: Monthly sales volume and revenue metric for a category.
      required:
        - year
        - totalQuantity
        - totalRevenue
      properties:
        year:
          type: string
          description: Year and month of the data point (format YYYY-MM).
          example: "2026-01"
        category:
          type:
            - string
            - "null"
          description: Category name (null when densified for months with zero sales).
          example: "Fantasy"
        totalQuantity:
          type: integer
          description: Total items sold in this month.
          example: 25
        totalRevenue:
          type: number
          format: double
          description: Total revenue generated in this month.
          example: 12500

    CategoryTrendResponse:
      type: object
      description: Response payload with monthly category sales trends.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: "success"
        data:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTrendItem"

    # =========================================================
    # BOOK RATING DISTRIBUTION SCHEMAS
    # =========================================================

    BookRatingDistributionItem:
      type: object
      description: Rating star counts (1 to 5 stars) for an individual book.
      required:
        - bookId
        - fiveStarRating
        - fourStarRating
        - threeStarRating
        - twoStarRating
        - oneStarRating
      properties:
        bookId:
          type: string
          description: Unique identifier of the reviewed book.
          example: "664b1f89e21b8c12a8901234"
        fiveStarRating:
          type: integer
          description: Count of 5-star ratings.
          example: 25
        fourStarRating:
          type: integer
          description: Count of 4-star ratings.
          example: 12
        threeStarRating:
          type: integer
          description: Count of 3-star ratings.
          example: 5
        twoStarRating:
          type: integer
          description: Count of 2-star ratings.
          example: 2
        oneStarRating:
          type: integer
          description: Count of 1-star ratings.
          example: 1

    BookRatingDistributionResponse:
      type: object
      description: Paginated response listing rating breakdown per book.
      required:
        - status
        - pagination
        - data
      properties:
        status:
          type: string
          example: "success"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
        data:
          type: array
          items:
            $ref: "#/components/schemas/BookRatingDistributionItem"

    # =========================================================
    # ORDER ANALYTICS & GROWTH SCHEMAS
    # =========================================================

    OrderStatusCount:
      type: object
      description: Count of orders possessing a specific status.
      required:
        - orderStatus
        - totalOrders
      properties:
        orderStatus:
          type: string
          description: Status of the order (e.g. paid, pending, cancelled).
          example: "paid"
        totalOrders:
          type: integer
          description: Number of orders currently in this status.
          example: 150

    OrderCancellationRate:
      type: object
      description: Total orders, cancelled order count, and calculated cancellation percentage.
      required:
        - totalOrders
        - cancelledOrders
        - cancellationRate
      properties:
        totalOrders:
          type: integer
          description: Overall orders placed.
          example: 180
        cancelledOrders:
          type: integer
          description: Total cancelled orders.
          example: 10
        cancellationRate:
          type: number
          format: double
          description: Percentage of orders cancelled.
          example: 5.56

    OrderAnalyticsData:
      type: object
      description: Order status counts and cancellation rate metrics.
      required:
        - orderStatusAnalytics
        - orderCancellationAnalytics
      properties:
        orderStatusAnalytics:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatusCount"
        orderCancellationAnalytics:
          type: array
          items:
            $ref: "#/components/schemas/OrderCancellationRate"

    OrderAnalyticsResponse:
      type: object
      description: Response payload for order status distribution and cancellation analytics.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: "success"
        data:
          $ref: "#/components/schemas/OrderAnalyticsData"

    DailyOrderGrowthItem:
      type: object
      description: Count of orders placed on a specific date.
      required:
        - date
        - totalOrders
      properties:
        date:
          type: string
          format: date
          description: Calendar date (YYYY-MM-DD).
          example: "2026-09-01"
        totalOrders:
          type: integer
          description: Count of orders created on this date.
          example: 12

    OrderGrowthResponse:
      type: object
      description: Response payload for daily order growth over a date range.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: "success"
        data:
          type: array
          items:
            $ref: "#/components/schemas/DailyOrderGrowthItem"

    # =========================================================
    # AVERAGE ORDER VALUE SCHEMAS
    # =========================================================

    MonthlyAvgOrderValueItem:
      type: object
      description: Monthly metrics for completed orders, total revenue, and average order value.
      required:
        - month
        - completedOrders
        - totalRevenue
        - avgOrderValue
      properties:
        month:
          type: string
          description: Year and month (YYYY-MM).
          example: "2026-01"
        completedOrders:
          type: integer
          description: Count of completed paid orders in this month.
          example: 45
        totalRevenue:
          type: number
          format: double
          description: Total revenue generated from paid orders in this month.
          example: 20250
        avgOrderValue:
          type: number
          format: double
          description: Average order value (totalRevenue / completedOrders) rounded to 2 decimal places.
          example: 450

    AverageOrderValueResponse:
      type: object
      description: Response payload for monthly average order value trends.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: "success"
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyAvgOrderValueItem"

    # =========================================================
    # CUSTOMER ANALYTICS SCHEMAS
    # =========================================================

    MonthlyUserGrowthItem:
      type: object
      description: New user registrations recorded in a given month.
      required:
        - month
        - totalUsers
      properties:
        month:
          type: string
          description: Year and month (YYYY-MM).
          example: "2026-01"
        totalUsers:
          type: integer
          description: Number of user accounts created during this month.
          example: 15

    TopPayingCustomerItem:
      type: object
      description: Top customer ranked by total expenditure on completed orders.
      required:
        - customerId
        - totalOrders
        - totalMoneySpent
      properties:
        customerId:
          type: string
          description: Unique customer user identifier.
          example: "664b1f89e21b8c12a8901234"
        totalOrders:
          type: integer
          description: Number of paid orders placed by this customer.
          example: 12
        totalMoneySpent:
          type: number
          format: double
          description: Total spending amount across all paid orders.
          example: 5400

    ReturningCustomerRate:
      type: object
      description: Retention metrics comparing single-order vs repeat customers.
      required:
        - totalCustomers
        - returningCustomers
        - returningCustomersRate
      properties:
        totalCustomers:
          type: integer
          description: Total unique customers who placed at least one paid order.
          example: 120
        returningCustomers:
          type: integer
          description: Customers who placed more than one paid order.
          example: 35
        returningCustomersRate:
          type: number
          format: double
          description: Percentage of returning customers relative to total customers.
          example: 29.17

    CustomerAnalyticsData:
      type: object
      description: Comprehensive metrics on user registration growth, top spenders, and repeat buyers.
      required:
        - userAnalytics
        - topPayingCustomers
        - returningCustomers
      properties:
        userAnalytics:
          type: array
          description: Monthly user registration growth.
          items:
            $ref: "#/components/schemas/MonthlyUserGrowthItem"
        topPayingCustomers:
          type: array
          description: Top 10 highest-spending customers.
          items:
            $ref: "#/components/schemas/TopPayingCustomerItem"
        returningCustomers:
          type: array
          description: Repeat customer retention metrics.
          items:
            $ref: "#/components/schemas/ReturningCustomerRate"

    CustomerAnalyticsResponse:
      type: object
      description: Response payload for customer registration, top spender, and retention analytics.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: "success"
        data:
          $ref: "#/components/schemas/CustomerAnalyticsData"

    # =========================================================
    # PAYMENT ANALYTICS SCHEMAS
    # =========================================================

    PaymentStatusAmounts:
      type: object
      description: Payment counts and totals categorized by payment status.
      required:
        - successfullPayments
        - successfullAmounts
        - failedPayments
        - failedAmounts
        - refundedPayments
        - refundedAmounts
      properties:
        successfullPayments:
          type: integer
          description: Number of successful payments.
          example: 180
        successfullAmounts:
          type: number
          format: double
          description: Total monetary sum of successful payments.
          example: 81000
        failedPayments:
          type: integer
          description: Number of failed payments.
          example: 12
        failedAmounts:
          type: number
          format: double
          description: Total monetary sum of failed payments.
          example: 5400
        refundedPayments:
          type: integer
          description: Number of refunded payments.
          example: 5
        refundedAmounts:
          type: number
          format: double
          description: Total monetary sum of refunded payments.
          example: 2250

    PaymentStatusRates:
      type: object
      description: Success and failure percentage rates of processed transactions.
      required:
        - successfullPayments
        - failedPayments
        - totalPayments
        - successRate
        - failedRate
      properties:
        successfullPayments:
          type: integer
          description: Total successful/completed transactions.
          example: 185
        failedPayments:
          type: integer
          description: Total failed transactions.
          example: 12
        totalPayments:
          type: integer
          description: Total payment attempts recorded.
          example: 197
        successRate:
          type: number
          format: double
          description: Success rate percentage rounded to 2 decimal places.
          example: 93.91
        failedRate:
          type: number
          format: double
          description: Failure rate percentage rounded to 2 decimal places.
          example: 6.09

    PaymentAnalyticsData:
      type: object
      description: Payment status totals and success/failure rates.
      required:
        - paymentStatusAnalytics
        - paymentStatusRate
      properties:
        paymentStatusAnalytics:
          type: array
          items:
            $ref: "#/components/schemas/PaymentStatusAmounts"
        paymentStatusRate:
          type: array
          items:
            $ref: "#/components/schemas/PaymentStatusRates"

    PaymentAnalyticsResponse:
      type: object
      description: Response payload for payment status and rate analytics.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: "success"
        data:
          $ref: "#/components/schemas/PaymentAnalyticsData"

    # =========================================================
    # USER DEACTIVATION SCHEMA
    # =========================================================

    DeactivateUserResponse:
      type: object
      description: Response returned when an administrator suspends a user account.
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "User is suspended"
        data:
          $ref: "#/components/schemas/User"

    # =========================================================
    # BOOK SCHEMAS
    # =========================================================

    Book:
      type: object
      description: |
        Complete Book entity representing a catalog item in the bookstore database.
        Includes product details, pricing, inventory stock, categorisation,
        Cloudinary cover image URL, and customer rating aggregates.
      required:
        - _id
        - title
        - author
        - stock
        - description
        - price
        - category
        - coverImage
      properties:
        _id:
          type: string
          description: Unique 24-character hexadecimal MongoDB ObjectId of the book.
          example: "683aab454ae6c56e60594eb7"
        title:
          type: string
          description: Title or name of the book.
          example: "Atomic Habits: An Easy & Proven Way to Build Good Habits & Break Bad Ones"
        author:
          type: string
          description: Full name of the book's author.
          example: "James Clear"
        stock:
          type: integer
          minimum: 0
          description: Available inventory quantity currently in stock.
          example: 45
        description:
          type: string
          description: Detailed synopsis, summary, or blurb of the book.
          example: "No matter your goals, Atomic Habits offers a proven framework for improving every day."
        totalSales:
          type: integer
          default: 0
          description: Total number of units sold across all completed customer orders.
          example: 120
        price:
          type: number
          format: double
          minimum: 0
          description: Retail purchase price of the book in USD.
          example: 24.99
        category:
          type: string
          enum:
            - Fantasy
            - Action
            - Adventure
            - Mystery
            - Horror
            - Thriller
            - Romance
            - Self-help
            - Biography
          description: Genre or department category classification.
          example: "Self-help"
        coverImage:
          type: string
          format: uri
          description: Public HTTPS URL of the book cover image stored and delivered via Cloudinary CDN.
          example: "https://res.cloudinary.com/bookstore/image/upload/v1717145678/BookStore/atomic-habits.jpg"
        ratingAverage:
          type: number
          format: double
          minimum: 0
          maximum: 5
          default: 0
          description: Average customer review rating score calculated from submitted reviews (scale 1.0 - 5.0).
          example: 4.8
        ratingQuantity:
          type: integer
          minimum: 0
          default: 0
          description: Total number of customer ratings/reviews submitted for this book.
          example: 84
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp indicating when the book was first added to the catalog.
          example: "2026-05-30T10:15:30.000Z"
        isDeleted:
          type: boolean
          default: false
          description: |
            Soft-deletion indicator flag. When set to `true`, the book is hidden
            from all public browsing and lookup queries via Mongoose query middleware.
          example: false

    CreateBookRequest:
      type: object
      description: |
        Payload required to register a new book in the bookstore catalog.
        Submitted as `multipart/form-data` to accommodate both book metadata
        and the book's cover image file upload.
      required:
        - title
        - author
        - stock
        - description
        - price
        - category
        - coverImage
      properties:
        title:
          type: string
          minLength: 2
          description: Title or name of the book (minimum 2 characters).
          example: "Clean Code: A Handbook of Agile Software Craftsmanship"
        author:
          type: string
          description: Full name of the author. Cannot be empty.
          example: "Robert C. Martin"
        stock:
          type: integer
          minimum: 0
          description: Initial inventory quantity. Must be a valid non-negative number.
          example: 30
        description:
          type: string
          description: Detailed description or synopsis of the book content.
          example: "Even bad code can function. But if code isn't clean, it can bring a development organization to its knees."
        price:
          type: number
          format: double
          minimum: 0
          description: Retail price of the book. Must be non-negative and at least 1 character in length.
          example: 37.99
        category:
          type: string
          enum:
            - Fantasy
            - Action
            - Adventure
            - Mystery
            - Horror
            - Thriller
            - Romance
            - Self-help
            - Biography
          description: Genre category selected from the predefined list of allowed categories.
          example: "Self-help"
        coverImage:
          type: string
          format: binary
          description: |
            Cover image file (JPEG, PNG, WebP) uploaded via form-data.
            The server automatically transmits this file to Cloudinary in the `BookStore` folder
            and deletes the local temporary file after upload.

    UpdateBookRequest:
      type: object
      description: |
        Payload for updating an existing book's metadata or replacing its cover image.
        All fields are optional; only provided fields will be updated.
        Supports both `multipart/form-data` (when uploading a replacement cover image)
        and `application/json` (when updating text/numeric fields only).
      properties:
        title:
          type: string
          minLength: 2
          description: Updated book title (minimum 2 characters).
          example: "Clean Code: A Handbook of Agile Software Craftsmanship (Updated Edition)"
        author:
          type: string
          description: Updated author name.
          example: "Robert C. Martin"
        stock:
          type: integer
          minimum: 0
          description: Updated inventory stock quantity.
          example: 50
        description:
          type: string
          description: Updated synopsis or description.
          example: "Updated edition with new exercises and best practices for modern software development."
        price:
          type: number
          format: double
          minimum: 0
          description: Updated retail price.
          example: 39.99
        category:
          type: string
          enum:
            - Fantasy
            - Action
            - Adventure
            - Mystery
            - Horror
            - Thriller
            - Romance
            - Self-help
            - Biography
          description: Updated genre category.
          example: "Self-help"
        coverImage:
          type: string
          format: binary
          description: |
            Optional replacement cover image file. If supplied, the image is uploaded to Cloudinary,
            and the book's `coverImage` attribute is updated to the newly generated URL.

    BookResponse:
      type: object
      description: Standard API response wrapper returning a single book object.
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          description: Human-readable operational message.
          example: "Book is found"
        data:
          $ref: "#/components/schemas/Book"

    GetAllBooksResponse:
      type: object
      description: Paginated API response returning a list of books matching search and filter criteria.
      required:
        - status
        - length
        - pagination
        - message
        - data
      properties:
        status:
          type: string
          example: "success"
        length:
          type: integer
          description: Number of book records returned in the current page.
          example: 10
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
        message:
          type: string
          description: Result indicator ("all books found" when records exist, "books not found" when query yields 0 items).
          example: "all books found"
        data:
          type: array
          description: Array of book records for the current page.
          items:
            $ref: "#/components/schemas/Book"

    DeleteBookResponse:
      type: object
      description: Response payload returned upon soft-deleting a book from the catalog.
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          description: Confirmation message indicating the book has been deleted.
          example: "Book is deleted"

    # =========================================================
    # CART SCHEMAS
    # =========================================================

    CartItem:
      type: object
      description: |
        An individual line item within the customer's shopping cart representing a specific book
        and its designated quantity.
      required:
        - book
        - quantity
      properties:
        _id:
          type: string
          description: Unique subdocument identifier of the item in the cart.
          example: "683aae014ae6c56e60594eb9"
        book:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the book.
          example: "683aab454ae6c56e60594eb7"
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: Quantity of this specific book in the cart (minimum 1).
          example: 2

    Cart:
      type: object
      description: |
        Customer shopping cart entity stored in MongoDB and cached in Redis.
        Contains the user reference, list of line items, calculated cumulative monetary
        total (`totalPrice`), calculated cumulative quantity (`totalQuantity`),
        and the `isOrdered` order status flag.
      required:
        - user
        - items
        - totalPrice
        - totalQuantity
        - isOrdered
      properties:
        _id:
          type: string
          description: Unique 24-character hexadecimal MongoDB ObjectId of the cart.
          example: "683aacc04ae6c56e60594eb8"
        user:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the user who owns the cart.
          example: "683aa9c34ae6c56e60594eb2"
        items:
          type: array
          description: Collection of line items currently stored in the cart.
          items:
            $ref: "#/components/schemas/CartItem"
        totalPrice:
          type: number
          format: double
          minimum: 0
          default: 0
          description: Cumulative price of all items in the cart (sum of unit price * quantity).
          example: 39.98
        totalQuantity:
          type: integer
          minimum: 0
          default: 0
          description: Cumulative item count across all books currently in the cart.
          example: 2
        isOrdered:
          type: boolean
          default: false
          description: Flag indicating whether this cart has been converted to a completed order.
          example: false

    AddToCartRequest:
      type: object
      description: |
        Request payload required to add a book to the customer's shopping cart
        or increment the quantity of an existing item.
      required:
        - bookId
        - quantity
      properties:
        bookId:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the book to add.
          example: "683aab454ae6c56e60594eb7"
        quantity:
          type: integer
          minimum: 1
          description: Number of copies to add to the cart. Must be at least 1 and within available inventory stock.
          example: 2

    CartResponse:
      type: object
      description: Standard API response wrapper returning the customer's cart data.
      required:
        - status
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          description: Operational message (e.g., "cart is found", "added to cart", "book was removed").
          example: "added to cart"
        data:
          description: The customer's cart document, or null if no cart exists yet.
          oneOf:
            - $ref: "#/components/schemas/Cart"
            - type: "null"

    # =========================================================
    # REVIEW SCHEMAS
    # =========================================================

    ReviewUserRef:
      type: object
      description: Populated user entity containing public reviewer identification.
      required:
        - _id
        - name
      properties:
        _id:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the user.
          example: "683aa9c34ae6c56e60594eb2"
        name:
          type: string
          description: Full name of the user who authored the review.
          example: "Keyur Panchal"

    ReviewBookRef:
      type: object
      description: Populated book reference containing minimal identification metadata.
      required:
        - _id
        - title
      properties:
        _id:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the reviewed book.
          example: "683aab454ae6c56e60594eb7"
        title:
          type: string
          description: Title of the reviewed book.
          example: "Clean Code"

    Review:
      type: object
      description: |
        Fully populated customer review document stored in MongoDB.
        Contains the written review content, star rating, author details,
        associated book, and creation/modification timestamps.
      required:
        - _id
        - review
        - rating
        - user
        - book
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          description: Unique 24-character hexadecimal MongoDB ObjectId of the review document.
          example: "683ab1234ae6c56e60594eca"
        review:
          type: string
          description: The textual review commentary submitted by the customer.
          example: "An exceptional, comprehensive guide to clean architecture and readable code."
        rating:
          type: number
          minimum: 1
          maximum: 5
          description: Customer rating score on a 1.0 to 5.0 star scale.
          example: 5
        user:
          $ref: "#/components/schemas/ReviewUserRef"
        book:
          $ref: "#/components/schemas/ReviewBookRef"
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of review submission.
          example: "2026-05-12T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of last modification.
          example: "2026-05-12T10:00:00.000Z"

    ReviewCreatedData:
      type: object
      description: |
        Newly created review document returned by MongoDB containing raw ObjectId references
        for user and book.
      required:
        - _id
        - review
        - rating
        - user
        - book
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          description: Unique 24-character hexadecimal MongoDB ObjectId of the newly created review.
          example: "683ab1234ae6c56e60594eca"
        review:
          type: string
          description: Textual content of the submitted review.
          example: "An exceptional, comprehensive guide to clean architecture and readable code."
        rating:
          type: number
          minimum: 1
          maximum: 5
          description: Star rating score (minimum 1, maximum 5).
          example: 5
        user:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the authoring user.
          example: "683aa9c34ae6c56e60594eb2"
        book:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the reviewed book.
          example: "683aab454ae6c56e60594eb7"
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp.
          example: "2026-05-12T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp.
          example: "2026-05-12T10:00:00.000Z"

    CreateReviewRequest:
      type: object
      description: Request payload required to submit a customer review and rating for a book.
      required:
        - review
        - rating
      properties:
        review:
          type: string
          minLength: 1
          description: Customer's detailed review commentary. Leading and trailing whitespace is trimmed.
          example: "An exceptional, comprehensive guide to clean architecture and readable code."
        rating:
          type: number
          minimum: 1
          maximum: 5
          description: Star rating for the book, ranging from 1 to 5.
          example: 5

    UpdateReviewRequest:
      type: object
      description: |
        Request payload for updating an existing customer review.
        At least one field should be supplied to modify the review.
      properties:
        review:
          type: string
          minLength: 1
          description: Updated review commentary.
          example: "Updated review: Still an absolute classic for any software craftsman."
        rating:
          type: number
          minimum: 1
          maximum: 5
          description: Updated star rating score on a scale from 1 to 5.
          example: 4.5

    CreateReviewResponse:
      type: object
      description: Response payload returned after successfully creating a new book review.
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Review created successfully"
        data:
          $ref: "#/components/schemas/ReviewCreatedData"

    UpdateReviewResponse:
      type: object
      description: Response payload returned after successfully modifying an existing review.
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "review updated successfully"

    DeleteReviewResponse:
      type: object
      description: Response payload returned after successfully deleting a customer review.
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Review deleted successfully"

    GetBookReviewsResponse:
      type: object
      description: Paginated collection of customer reviews for a specific book.
      required:
        - status
        - length
        - pagination
        - data
      properties:
        status:
          type: string
          example: "success"
        length:
          type: integer
          description: Total number of review records returned on the current page.
          example: 2
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
        data:
          type: array
          description: Array of populated review documents matching the search and pagination criteria.
          items:
            $ref: "#/components/schemas/Review"

    GetAllReviewsAdminResponse:
      type: object
      description: Paginated catalog-wide collection of customer reviews for administrator oversight.
      required:
        - status
        - message
        - pagination
        - length
        - data
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "reviews found successfully"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
        length:
          type: integer
          description: Total number of review records returned on the current page.
          example: 10
        data:
          type: array
          description: Array of populated review records across all books in the catalog.
          items:
            $ref: "#/components/schemas/Review"

    GetMyReviewResponse:
      type: object
      description: Single customer review document retrieved for the authenticated user and specified book.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          description: Operational status message included when retrieved from Redis cache ("review found successfully").
          example: "review found successfully"
        data:
          $ref: "#/components/schemas/Review"

    # =========================================================
    # ORDER SCHEMAS
    # =========================================================

    OrderItem:
      type: object
      description: An individual book line item included in an order with purchased quantity.
      required:
        - book
        - quantity
      properties:
        _id:
          type: string
          description: Unique subdocument identifier for this item line.
          example: "683aae014ae6c56e60594eb9"
        book:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the purchased book.
          example: "683aab454ae6c56e60594eb7"
        quantity:
          type: integer
          minimum: 1
          description: Quantity of this specific book purchased.
          example: 2

    OrderShippingAddress:
      type: object
      description: Shipping contact and delivery address snapshot captured at order placement.
      required:
        - name
        - email
        - phoneNumber
        - street
        - city
        - state
        - zipCode
      properties:
        name:
          type: string
          description: Full name of the recipient.
          example: "Keyur Panchal"
        email:
          type: string
          format: email
          description: Email address for order status notifications.
          example: "keyur.panchal@example.com"
        phoneNumber:
          type: integer
          description: Recipient's 10-digit telephone contact number.
          example: 9876543210
        street:
          type: string
          description: Street name and house/flat identifier.
          example: "123 Tech Park Road"
        city:
          type: string
          description: City of delivery.
          example: "Ahmedabad"
        state:
          type: string
          description: State or province.
          example: "Gujarat"
        zipCode:
          type: integer
          description: Postal or ZIP code.
          example: 382418

    OrderPaymentInfo:
      type: object
      description: Stripe payment gateway transaction metadata and settlement status.
      required:
        - paymentMethod
        - status
      properties:
        stripePaymentId:
          type: string
          description: Stripe Payment Intent identifier (e.g., `pi_3Nz...`).
          example: "pi_3NzABC1234567890XYZ"
        stripeClientSecret:
          type: string
          description: Client secret used for frontend Stripe SDK confirmation.
          example: "pi_3NzABC1234567890XYZ_secret_abc123"
        paymentMethod:
          type: string
          enum:
            - card
          default: card
          description: Payment method utilized for checkout.
          example: "card"
        status:
          type: string
          enum:
            - unpaid
            - paid
            - failed
            - cancelled
          default: unpaid
          description: Current lifecycle status of the payment.
          example: "paid"
        paidAt:
          type: string
          format: date-time
          description: Timestamp when the payment was successfully captured.
          example: "2026-05-12T10:05:00.000Z"

    Order:
      type: object
      description: Full customer order document recorded in MongoDB and cached in Redis.
      required:
        - _id
        - user
        - items
        - totalQuantity
        - totalPrice
        - shippingAddress
        - orderStatus
        - paymentInfo
        - createdAt
      properties:
        _id:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId uniquely identifying the order.
          example: "683b1c204ae6c56e60594ed0"
        user:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the customer who placed the order.
          example: "683aa9c34ae6c56e60594eb2"
        items:
          type: array
          description: Collection of purchased book line items with corresponding quantities.
          items:
            $ref: "#/components/schemas/OrderItem"
        totalQuantity:
          type: integer
          minimum: 1
          description: Cumulative item count across all books in the order.
          example: 3
        totalPrice:
          type: number
          format: double
          minimum: 0
          description: Total order charge amount in currency units (INR).
          example: 1250.00
        shippingAddress:
          $ref: "#/components/schemas/OrderShippingAddress"
        orderStatus:
          type: string
          enum:
            - pending
            - paid
            - cancelled
          default: pending
          description: Current fulfillment and processing status of the order.
          example: "paid"
        paymentInfo:
          $ref: "#/components/schemas/OrderPaymentInfo"
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the order was placed.
          example: "2026-05-12T10:00:00.000Z"

    CheckoutSessionResponse:
      type: object
      description: Response payload returned upon successfully creating a Stripe checkout session.
      required:
        - status
        - url
        - data
      properties:
        status:
          type: string
          example: "success"
        url:
          type: string
          format: uri
          description: Stripe-hosted Checkout redirection URL where customer completes payment.
          example: "https://checkout.stripe.com/c/pay/cs_test_a1b2c3d4e5f6"
        data:
          type: object
          description: Summary representation of the created Stripe checkout session object.
          properties:
            id:
              type: string
              description: Stripe Checkout Session identifier.
              example: "cs_test_a1b2c3d4e5f6"
            object:
              type: string
              example: "checkout.session"
            customer_email:
              type: string
              format: email
              example: "customer@example.com"
            mode:
              type: string
              example: "payment"
            payment_status:
              type: string
              example: "unpaid"
            url:
              type: string
              format: uri
              example: "https://checkout.stripe.com/c/pay/cs_test_a1b2c3d4e5f6"

    RefundPaymentResponse:
      type: object
      description: Response payload returned upon successfully initiating a customer refund via Stripe.
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "payment refund successfull"
        data:
          type: object
          description: Stripe refund object representation.
          properties:
            id:
              type: string
              description: Stripe Refund identifier (e.g., `re_3Nz...`).
              example: "re_3NzABC1234567890XYZ"
            object:
              type: string
              example: "refund"
            amount:
              type: integer
              description: Refunded amount in smallest currency denomination (paise).
              example: 125000
            currency:
              type: string
              example: "inr"
            payment_intent:
              type: string
              example: "pi_3NzABC1234567890XYZ"
            status:
              type: string
              example: "succeeded"
            reason:
              type: string
              example: "requested_by_customer"

    GetAllOrdersResponse:
      type: object
      description: Paginated API response returning platform-wide customer orders for administrators.
      required:
        - status
        - length
        - message
        - pagination
        - data
      properties:
        status:
          type: string
          example: "success"
        length:
          type: integer
          description: Number of order records returned in the current page.
          example: 10
        message:
          type: string
          description: Operational message ("all orders found successfully" or "orders not found").
          example: "all orders found successfully"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
        data:
          type: array
          description: Collection of order documents for the current page.
          items:
            $ref: "#/components/schemas/Order"

    GetOneOrderResponse:
      type: object
      description: Standard API response returning an individual order document.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: "success"
        data:
          $ref: "#/components/schemas/Order"

    # =========================================================
    # USER MANAGEMENT SCHEMAS
    # =========================================================

    GetAllUsersResponse:
      type: object
      description: Paginated API response returning a list of registered users for administrators.
      required:
        - status
        - length
        - pagination
        - message
        - allUser
      properties:
        status:
          type: string
          example: "success"
        length:
          type: integer
          description: Total number of user records returned in the current page.
          example: 10
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
        message:
          type: string
          description: Operational message indicating whether users were found.
          example: "all users found successfully"
        allUser:
          type: array
          description: Array of active user account records matching filter criteria.
          items:
            $ref: "#/components/schemas/User"

    GetUserProfileResponse:
      type: object
      description: Standard API response returning complete profile details for a user.
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "user found successfully"
        data:
          $ref: "#/components/schemas/User"

    GetUserOrdersResponse:
      type: object
      description: List of historical orders placed by the authenticated customer.
      required:
        - status
        - length
        - data
      properties:
        status:
          type: string
          example: "success"
        length:
          type: integer
          description: Total count of past orders placed by the customer.
          example: 3
        data:
          type: array
          description: Collection of order documents associated with the user account.
          items:
            $ref: "#/components/schemas/Order"

    UpdateUserRequest:
      type: object
      description: |
        Request payload containing personal profile attributes to update.
        All fields are optional; only provided fields will be modified.
      properties:
        name:
          type: string
          minLength: 2
          description: Updated full name of the user.
          example: "Keyur Panchal"
        phoneNumber:
          type: integer
          description: Updated 10-digit primary telephone contact number.
          example: 9876543210
        gender:
          type: string
          enum:
            - male
            - female
            - others
          description: Updated gender identity.
          example: "male"
        dateOfBirth:
          type: string
          format: date
          description: Updated date of birth (YYYY-MM-DD).
          example: "2005-06-08"
        address:
          $ref: "#/components/schemas/Address"

    UpdateUserResponse:
      type: object
      description: Response payload returned after modifying user profile details.
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "user updated successfully"

    AddFavBookRequest:
      type: object
      description: Request payload specifying the book to append to customer favourites.
      required:
        - bookId
      properties:
        bookId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: 24-character hexadecimal MongoDB ObjectId of the book to add to favourites.
          example: "683aab454ae6c56e60594eb7"

    AddFavBookResponse:
      type: object
      description: Response returned upon successfully appending a book to customer favourites.
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Book added to favourites"
        data:
          $ref: "#/components/schemas/User"

    # =========================================================
    # WISHLIST SCHEMAS
    # =========================================================

    WishlistBookItem:
      type: object
      description: Essential book details populated within a customer's saved wishlist item.
      required:
        - _id
        - title
        - author
        - price
      properties:
        _id:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the book.
          example: "683aab454ae6c56e60594eb7"
        title:
          type: string
          description: Title of the book.
          example: "Clean Code"
        author:
          type: string
          description: Author of the book.
          example: "Robert C. Martin"
        price:
          type: number
          format: double
          description: Retail purchase price of the book.
          example: 450
        coverImage:
          type: string
          format: uri
          description: Cloudinary image URL for the book cover.
          example: "https://res.cloudinary.com/demo/image/upload/v1/clean-code.jpg"
        category:
          type: string
          description: Genre category of the book.
          example: "Action"
        ratingAverage:
          type: number
          format: float
          description: Average customer review rating.
          example: 4.8
        stock:
          type: integer
          description: Available inventory quantity currently in stock.
          example: 15

    WishlistItem:
      type: object
      description: Customer wishlist record containing populated book catalog details.
      required:
        - _id
        - user
        - book
        - createdAt
      properties:
        _id:
          type: string
          description: Unique 24-character hexadecimal MongoDB ObjectId of the wishlist entry.
          example: "683b5f104ae6c56e60594eee"
        user:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the customer who saved the item.
          example: "683aa9c34ae6c56e60594eb2"
        book:
          $ref: "#/components/schemas/WishlistBookItem"
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the book was saved to the wishlist.
          example: "2026-05-12T10:00:00.000Z"

    WishlistRawItem:
      type: object
      description: Newly created wishlist record with raw book ObjectId reference.
      required:
        - _id
        - user
        - book
        - createdAt
      properties:
        _id:
          type: string
          description: Unique 24-character hexadecimal MongoDB ObjectId of the wishlist item.
          example: "683b5f104ae6c56e60594eee"
        user:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the customer.
          example: "683aa9c34ae6c56e60594eb2"
        book:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the saved book.
          example: "683aab454ae6c56e60594eb7"
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp.
          example: "2026-05-12T10:00:00.000Z"

    GetAllWishlistResponse:
      type: object
      description: Response payload containing all books currently saved in the customer's wishlist.
      required:
        - status
        - message
        - results
        - data
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "All wishlist items are successfully found"
        results:
          type: integer
          description: Total count of saved books returned in the wishlist.
          example: 2
        data:
          type: array
          description: List of wishlist items populated with book catalog details.
          items:
            $ref: "#/components/schemas/WishlistItem"

    AddToWishlistResponse:
      type: object
      description: Response payload confirming successful addition of a book to the wishlist.
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Book successfully added to wishlist"
        data:
          $ref: "#/components/schemas/WishlistRawItem"

    RemoveFromWishlistResponse:
      type: object
      description: Response payload confirming successful removal of a book from the wishlist.
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Book successfully removed from wishlist"







