                  stock: 65
                  description: Updated edition with new exercises and best practices for modern software development.
                  totalSales: 120
                  price: 21.99
                  category: Self-help
                  coverImage: https://res.cloudinary.com/bookstore/image/upload/v1717149999/BookStore/atomic-habits-v2.jpg
                  ratingAverage: 4.8
