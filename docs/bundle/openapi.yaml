    Book:
      type: object
      description: |
        Complete Book entity representing a catalog item in the bookstore database.
        Includes product details, pricing, inventory stock, categorisation,
        Cloudinary cover image URL, and customer rating aggregates.
      required:
        - _id
        - title
        - author
        - stock
        - description
        - price
        - category
        - coverImage
      properties:
        _id:
          type: string
          description: Unique 24-character hexadecimal MongoDB ObjectId of the book.
          example: 683aab454ae6c56e60594eb7
        title:
          type: string
          description: Title or name of the book.
          example: 'Atomic Habits: An Easy & Proven Way to Build Good Habits & Break Bad Ones'
        author:
          type: string
          description: Full name of the book's author.
          example: James Clear
        stock:
          type: integer
          minimum: 0
          description: Available inventory quantity currently in stock.
          example: 45
        description:
          type: string
          description: Detailed synopsis, summary, or blurb of the book.
          example: No matter your goals, Atomic Habits offers a proven framework for improving every day.
        totalSales:
          type: integer
          default: 0
          description: Total number of units sold across all completed customer orders.
          example: 120
        price:
          type: number
          format: double
          minimum: 0
          description: Retail purchase price of the book in USD.
          example: 24.99
        category:
          type: string
          enum:
            - Fantasy
            - Action
            - Adventure
            - Mystery
            - Horror
            - Thriller
            - Romance
            - Self-help
            - Biography
          description: Genre or department category classification.
          example: Self-help
        coverImage:
          type: string
          format: uri
          description: Public HTTPS URL of the book cover image stored and delivered via Cloudinary CDN.
          example: https://res.cloudinary.com/bookstore/image/upload/v1717145678/BookStore/atomic-habits.jpg
        ratingAverage:
          type: number
          format: double
          minimum: 0
          maximum: 5
          default: 0
          description: Average customer review rating score calculated from submitted reviews (scale 1.0 - 5.0).
          example: 4.8
        ratingQuantity:
          type: integer
          minimum: 0
          default: 0
          description: Total number of customer ratings/reviews submitted for this book.
          example: 84
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp indicating when the book was first added to the catalog.
          example: '2026-05-30T10:15:30.000Z'
        isDeleted:
          type: boolean
          default: false
          description: |
            Soft-deletion indicator flag. When set to `true`, the book is hidden
            from all public browsing and lookup queries via Mongoose query middleware.
          example: false
    CreateBookRequest:
      type: object
      description: |
        Payload required to register a new book in the bookstore catalog.
        Submitted as `multipart/form-data` to accommodate both book metadata
        and the book's cover image file upload.
      required:
        - title
        - author
        - stock
        - description
        - price
        - category
        - coverImage
      properties:
        title:
          type: string
          minLength: 2
          description: Title or name of the book (minimum 2 characters).
          example: 'Clean Code: A Handbook of Agile Software Craftsmanship'
        author:
          type: string
          description: Full name of the author. Cannot be empty.
          example: Robert C. Martin
        stock:
          type: integer
          minimum: 0
          description: Initial inventory quantity. Must be a valid non-negative number.
          example: 30
        description:
          type: string
          description: Detailed description or synopsis of the book content.
          example: Even bad code can function. But if code isn't clean, it can bring a development organization to its knees.
        price:
          type: number
          format: double
          minimum: 0
          description: Retail price of the book. Must be non-negative and at least 1 character in length.
          example: 37.99
        category:
          type: string
          enum:
            - Fantasy
            - Action
            - Adventure
            - Mystery
            - Horror
            - Thriller
            - Romance
            - Self-help
            - Biography
          description: Genre category selected from the predefined list of allowed categories.
          example: Self-help
        coverImage:
          type: string
          format: binary
          description: |
            Cover image file (JPEG, PNG, WebP) uploaded via form-data.
            The server automatically transmits this file to Cloudinary in the `BookStore` folder
            and deletes the local temporary file after upload.
    UpdateBookRequest:
      type: object
      description: |
        Payload for updating an existing book's metadata or replacing its cover image.
        All fields are optional; only provided fields will be updated.
        Supports both `multipart/form-data` (when uploading a replacement cover image)
        and `application/json` (when updating text/numeric fields only).
      properties:
        title:
          type: string
          minLength: 2
          description: Updated book title (minimum 2 characters).
          example: 'Clean Code: A Handbook of Agile Software Craftsmanship (Updated Edition)'
        author:
          type: string
          description: Updated author name.
          example: Robert C. Martin
        stock:
          type: integer
          minimum: 0
          description: Updated inventory stock quantity.
          example: 50
        description:
          type: string
          description: Updated synopsis or description.
          example: Updated edition with new exercises and best practices for modern software development.
        price:
          type: number
          format: double
          minimum: 0
          description: Updated retail price.
          example: 39.99
        category:
          type: string
          enum:
            - Fantasy
            - Action
            - Adventure
            - Mystery
            - Horror
            - Thriller
            - Romance
            - Self-help
            - Biography
          description: Updated genre category.
          example: Self-help
        coverImage:
          type: string
          format: binary
          description: |
            Optional replacement cover image file. If supplied, the image is uploaded to Cloudinary,
            and the book's `coverImage` attribute is updated to the newly generated URL.
    BookResponse:
      type: object
      description: Standard API response wrapper returning a single book object.
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          description: Human-readable operational message.
          example: Book is found
        data:
          $ref: '#/components/schemas/Book'
    GetAllBooksResponse:
      type: object
      description: Paginated API response returning a list of books matching search and filter criteria.
      required:
        - status
        - length
        - pagination
        - message
        - data
      properties:
        status:
          type: string
          example: success
        length:
          type: integer
          description: Number of book records returned in the current page.
          example: 10
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
        message:
          type: string
          description: Result indicator ("all books found" when records exist, "books not found" when query yields 0 items).
          example: all books found
        data:
          type: array
          description: Array of book records for the current page.
          items:
            $ref: '#/components/schemas/Book'
    DeleteBookResponse:
      type: object
      description: Response payload returned upon soft-deleting a book from the catalog.
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          description: Confirmation message indicating the book has been deleted.
          example: Book is deleted
    CartItem:
      type: object
      description: |
        An individual line item within the customer's shopping cart representing a specific book
        and its designated quantity.
      required:
        - book
        - quantity
      properties:
        _id:
          type: string
          description: Unique subdocument identifier of the item in the cart.
          example: 683aae014ae6c56e60594eb9
        book:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the book.
          example: 683aab454ae6c56e60594eb7
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: Quantity of this specific book in the cart (minimum 1).
          example: 2
    Cart:
      type: object
      description: |
        Customer shopping cart entity stored in MongoDB and cached in Redis.
        Contains the user reference, list of line items, calculated cumulative monetary
        total (`totalPrice`), calculated cumulative quantity (`totalQuantity`),
        and the `isOrdered` order status flag.
      required:
        - user
        - items
        - totalPrice
        - totalQuantity
        - isOrdered
      properties:
        _id:
          type: string
          description: Unique 24-character hexadecimal MongoDB ObjectId of the cart.
          example: 683aacc04ae6c56e60594eb8
        user:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the user who owns the cart.
          example: 683aa9c34ae6c56e60594eb2
        items:
          type: array
          description: Collection of line items currently stored in the cart.
          items:
            $ref: '#/components/schemas/CartItem'
        totalPrice:
          type: number
          format: double
          minimum: 0
          default: 0
          description: Cumulative price of all items in the cart (sum of unit price * quantity).
          example: 39.98
        totalQuantity:
          type: integer
          minimum: 0
          default: 0
          description: Cumulative item count across all books currently in the cart.
          example: 2
        isOrdered:
          type: boolean
          default: false
          description: Flag indicating whether this cart has been converted to a completed order.
          example: false
    AddToCartRequest:
      type: object
      description: |
        Request payload required to add a book to the customer's shopping cart
        or increment the quantity of an existing item.
      required:
        - bookId
        - quantity
      properties:
        bookId:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the book to add.
          example: 683aab454ae6c56e60594eb7
        quantity:
          type: integer
          minimum: 1
          description: Number of copies to add to the cart. Must be at least 1 and within available inventory stock.
          example: 2
    CartResponse:
      type: object
      description: Standard API response wrapper returning the customer's cart data.
      required:
        - status
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          description: Operational message (e.g., "cart is found", "added to cart", "book was removed").
          example: added to cart
        data:
          description: The customer's cart document, or null if no cart exists yet.
          oneOf:
            - $ref: '#/components/schemas/Cart'
            - type: 'null'
    ReviewUserRef:
      type: object
      description: Populated user entity containing public reviewer identification.
      required:
        - _id
        - name
      properties:
        _id:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the user.
          example: 683aa9c34ae6c56e60594eb2
        name:
          type: string
          description: Full name of the user who authored the review.
          example: Keyur Panchal
    ReviewBookRef:
      type: object
      description: Populated book reference containing minimal identification metadata.
      required:
        - _id
        - title
      properties:
        _id:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the reviewed book.
          example: 683aab454ae6c56e60594eb7
        title:
          type: string
          description: Title of the reviewed book.
          example: Clean Code
    Review:
      type: object
      description: |
        Fully populated customer review document stored in MongoDB.
        Contains the written review content, star rating, author details,
        associated book, and creation/modification timestamps.
      required:
        - _id
        - review
        - rating
        - user
        - book
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          description: Unique 24-character hexadecimal MongoDB ObjectId of the review document.
          example: 683ab1234ae6c56e60594eca
        review:
          type: string
          description: The textual review commentary submitted by the customer.
          example: An exceptional, comprehensive guide to clean architecture and readable code.
        rating:
          type: number
          minimum: 1
          maximum: 5
          description: Customer rating score on a 1.0 to 5.0 star scale.
          example: 5
        user:
          $ref: '#/components/schemas/ReviewUserRef'
        book:
          $ref: '#/components/schemas/ReviewBookRef'
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of review submission.
          example: '2026-05-12T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of last modification.
          example: '2026-05-12T10:00:00.000Z'
    ReviewCreatedData:
      type: object
      description: |
        Newly created review document returned by MongoDB containing raw ObjectId references
        for user and book.
      required:
        - _id
        - review
        - rating
        - user
        - book
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          description: Unique 24-character hexadecimal MongoDB ObjectId of the newly created review.
          example: 683ab1234ae6c56e60594eca
        review:
          type: string
          description: Textual content of the submitted review.
          example: An exceptional, comprehensive guide to clean architecture and readable code.
        rating:
          type: number
          minimum: 1
          maximum: 5
          description: Star rating score (minimum 1, maximum 5).
          example: 5
        user:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the authoring user.
          example: 683aa9c34ae6c56e60594eb2
        book:
          type: string
          description: 24-character hexadecimal MongoDB ObjectId of the reviewed book.
          example: 683aab454ae6c56e60594eb7
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp.
          example: '2026-05-12T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp.
          example: '2026-05-12T10:00:00.000Z'
    CreateReviewRequest:
      type: object
      description: Request payload required to submit a customer review and rating for a book.
      required:
        - review
        - rating
      properties:
        review:
          type: string
          minLength: 1
          description: Customer's detailed review commentary. Leading and trailing whitespace is trimmed.
          example: An exceptional, comprehensive guide to clean architecture and readable code.
        rating:
