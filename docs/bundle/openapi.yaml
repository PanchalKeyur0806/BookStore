      summary: Update the authenticated user's profile information
      description: |
        Updates personal profile information, contact number, gender, date of birth,
        or physical shipping address for the currently authenticated user.

        ### Authentication & Access Control
        - **Required Authentication**: Bearer JWT token (`protect` middleware).
        - **Email Verification**: User account email address must be verified (`isEmailVerified: true`).

        ### Operational Behavior & Validation
        - **Input Validation (`validateUser` middleware)**:
          - `name`: Optional, must be a string (`"Name must be a string"`).
          - `dateOfBirth`: Optional, must be a valid ISO date (`"Date of birth must be a date"`).
          - `phoneNumber`: Optional, must be a numeric value (`"Phone Number must be a number"`).
          - `gender`: Optional, must be one of `["male", "female", "others"]` (`"Gender must be male, female, or others"`).
          - `address`: Optional object (`"Address must be an object"`).
          - `address.line`, `address.street`, `address.city`, `address.state`, `address.country`: Optional, must be strings.
          - `address.zipCode`: Optional, must be a numeric value (`"Zip Code must be a number"`).
          - Any validation failure returns HTTP `400 Bad Request` with the first validation error message.
        - **Database Update**:
          - Executes `User.findByIdAndUpdate(req.user.id, { name, dateOfBirth, phoneNumber, gender, address })`.
          - If the update operation cannot be fulfilled, returns HTTP `400 Bad Request` (`"user is not updated"`).
          - Upon successful update, responds with HTTP `201 Created` returning the updated user document in `data`.

        ### Rate Limiting
        - Protected by `mutationLimiter`: Maximum **10 mutation requests per minute** per client IP.
