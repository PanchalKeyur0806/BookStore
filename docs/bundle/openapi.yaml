      summary: Suspend / deactivate a user account
      description: |
        Suspends and deactivates a user account by setting `isActive: false` using `User.findByIdAndUpdate`.
        Once deactivated, the user is blocked from logging in or performing customer operations, and excluded from public user queries.

        ### Authentication & Access Control
        - **Required Authentication**: Bearer JWT token in the `Authorization` header (`protect` middleware).
        - **Role Restriction**: Strictly restricted to administrators (`restrictTo("admin")`).

        ### Security & Business Constraints
        - **Self-Deactivation Guard**: An administrator cannot suspend their own account (`userId === req.user.id`). Attempting to do so returns HTTP `400 Bad Request` (`"You can't deactivate your self"`).
        - **Admin Account Protection**: Administrators cannot suspend other administrator accounts (`user.role === 'admin'`). Attempting to do so returns HTTP `400 Bad Request` (`"You can't deactivate admin user"`).

        ### Validation & Rate Limiting
        - **ID Validation**: `validateId("userId")` validates that `userId` is a valid 24-character hexadecimal MongoDB ObjectId. Returns HTTP `400 Bad Request` (`"Invalid Id, please enter correct id"`) if malformed.
        - **Rate Limiting**: Protected by `mutationLimiter` (maximum **10 mutation requests per minute**) and router-level `getRateLimiter` (maximum **30 requests per minute**).
