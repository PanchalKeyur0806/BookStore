  /admin/activateUser/{userId}:
    patch:
      operationId: activateUser
      security:
        - bearerAuth: []
      tags:
        - admin
      summary: Activate / unsuspend a user account
      description: |
        Restores and activates a suspended user account by setting `isActive: true` and persisting the change with `user.save()`.
        Once activated, the customer regains access to their account, can log in, and place bookstore orders.

        ### Authentication & Access Control
        - **Required Authentication**: Bearer JWT token in the `Authorization` header (`protect` middleware).
        - **Role Restriction**: Strictly restricted to administrators (`restrictTo("admin")`).

        ### Validation & Rate Limiting
