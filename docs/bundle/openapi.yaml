  /books/{bookId}:
    get:
      operationId: getBookById
      security: []
      tags:
        - books
      summary: Retrieve a book by its unique ID (with Redis caching)
      description: |
        Retrieves detailed information for a specific book identified by its unique MongoDB ObjectId.

        ### High-Performance Redis Caching
        This endpoint implements a **cache-aside** caching strategy using Redis:
        1. The server checks for the Redis key `book:{bookId}`.
        2. **Cache Hit**: If the key exists, cached JSON data is parsed and returned immediately without accessing the MongoDB database.
        3. **Cache Miss**:
           - Validates that `bookId` parameter is present and valid.
           - Queries MongoDB via `Books.findById(bookId)`.
           - The Mongoose `pre(/^find/)` middleware automatically filters out soft-deleted books (`isDeleted: false`).
           - If the book is not found in MongoDB, returns HTTP `404 Not Found`.
           - If found, writes the serialized book document into Redis under `book:{bookId}` and returns HTTP `200 OK`.

        ### Rate Limiting
        - Protected by `getRateLimiter`: Maximum **30 requests per minute** per client IP.
      parameters:
        - name: bookId
          in: path
          required: true
          description: |
            24-character hexadecimal MongoDB ObjectId of the book to retrieve.
          schema:
            type: string
          example: 683aab454ae6c56e60594eb7
      responses:
        '200':
          description: Book found successfully (served from Redis cache or database).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
              example:
                status: success
                message: Book is found
                data:
                  _id: 683aab454ae6c56e60594eb7
                  title: Atomic Habits
                  author: James Clear
                  stock: 45
                  description: An Easy & Proven Way to Build Good Habits & Break Bad Ones. Tiny Changes, Remarkable Results.
                  totalSales: 120
                  price: 19.99
                  category: Self-help
                  coverImage: https://res.cloudinary.com/bookstore/image/upload/v1717145678/BookStore/atomic-habits.jpg
                  ratingAverage: 4.8
                  ratingQuantity: 84
                  createdAt: '2026-05-30T10:15:30.000Z'
                  isDeleted: false
        '400':
          description: Missing or malformed book ID parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Book id not found, please provide bookId in params
        '404':
          description: Book not found in catalog or has been soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Book not found
        '429':
