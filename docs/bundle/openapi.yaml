  /cart/remove/{bookId}:
    post:
      operationId: removeBookFromCart
      security:
        - bearerAuth: []
      tags:
        - cart
      summary: Remove a book from the shopping cart
      description: |
        Removes a specific book item entirely from the authenticated customer's shopping cart.

        Automatically recalculates cumulative price (`totalPrice`) and quantity (`totalQuantity`)
        based on the removed book's unit price, and synchronizes the updated cart with Redis cache.

        This endpoint requires authentication and is restricted to customers with `role: 'user'`.

        ### In-Depth Business & Controller Logic
        1. **Parameter & ObjectId Validation**:
           - Middleware `validateId("bookId")` validates that `bookId` is a syntactically valid
             24-character hexadecimal MongoDB ObjectId (`mongoose.Types.ObjectId.isValid`).
             If invalid, returns HTTP `400 Bad Request`: `"Invalid Id, please enter correct id"`.
           - If `bookId` is missing, returns HTTP `400 Bad Request`:
             `"please provide book id to remove a book from the cart"`.
        2. **Cart Discovery**:
           - Looks up the user's cart in MongoDB: `Cart.findOne({ user: id })`.
           - If no cart exists for the user, returns HTTP `404 Not Found`:
             `"cart not found, please create your cart first"`.
        3. **Item Identification**:
           - Searches for the book within `cart.items`:
             `index = findExistingCart.items.findIndex(item => item.book.toString() === bookId)`.
           - If the book is not present in the cart (`index === -1`), returns HTTP `404 Not Found`:
             `"book not found in the cart"`.
        4. **Price & Quantity Reconciliation**:
           - Extracts the removed item's stored quantity: `removedQty = removedItem.quantity`.
           - Queries the book details from MongoDB (`Books.findById(removedItem.book._id)`) to get its unit price.
           - Computes deducted price: `removedPrice = findBook.price * removedQty`.
           - Splices the item out of the `items` array: `cart.items.splice(index, 1)`.
           - Subtracts from totals:
             - `cart.totalPrice -= removedPrice`
             - `cart.totalQuantity -= removedQty`
           - **Empty Cart Handling**: If all items have been removed (`cart.items.length === 0`),
             explicitly resets `totalPrice = 0` and `totalQuantity = 0`.
        5. **Persistence & Cache Sync**:
           - Saves the updated cart in MongoDB: `await findExistingCart.save()`.
           - Updates Redis key `user:{userId}:cart` with the serialized updated cart.
        6. **Response**:
           - Returns HTTP `200 OK` with `{ status: "success", message: "book was removed", data: findExistingCart }`.

        ### Rate Limiting
        - Protected by `mutationLimiter`: Maximum **10 mutations per minute** per client IP.
      parameters:
        - name: bookId
          in: path
          required: true
          description: |
            24-character hexadecimal MongoDB ObjectId of the book to remove from the cart.
          schema:
            type: string
          example: 683aab454ae6c56e60594eb7
      responses:
        '200':
          description: Book removed from cart and totals reconciled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              example:
                status: success
                message: book was removed
                data:
                  _id: 683aacc04ae6c56e60594eb8
                  user: 683aa9c34ae6c56e60594eb2
                  items: []
                  totalPrice: 0
                  totalQuantity: 0
                  isOrdered: false
        '400':
          description: Invalid book ID syntax or missing parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidIdSyntax:
                  summary: Malformed MongoDB ObjectId
                  value:
                    status: Error
                    message: Invalid Id, please enter correct id
                missingBookId:
                  summary: Missing bookId parameter
                  value:
                    status: Error
                    message: please provide book id to remove a book from the cart
        '401':
          description: Missing or invalid JWT authentication token.
          content:
