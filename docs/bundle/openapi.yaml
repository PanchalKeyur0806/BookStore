  /books:
    get:
      operationId: getAllBooks
      security: []
      tags:
        - books
      summary: Retrieve all books with search, sort, and pagination
      description: |
        Retrieves a paginated collection of active books from the catalog.

        Supports keyword filtering by book title and author using case-insensitive
        regular expressions (`$regex`, `$options: "i"`). Results can be sorted in
        descending (newest) or ascending (oldest) chronological order by creation date.

        ### Soft Deletion & Visibility
        Soft-deleted books (`isDeleted: true`) are automatically excluded from the
        result set by a Mongoose `pre(/^find/)` query middleware.

        ### Search & Filtering Capabilities
        - **Title Search**: Substring match against book titles.
        - **Author Search**: Substring match against author names.
        - Both filters can be used independently or combined.

        ### Sorting Behavior
        - `sort=new` (default): Sorts descending by `-createdAt` (newest books first).
        - `sort=old`: Sorts ascending by `createdAt` (oldest books first).
        - Any unrecognized sort parameter defaults to `new`.

        ### Pagination Rules
        - `page`: 1-based page index (defaults to `1`).
        - `limit`: Number of records returned per page (defaults to `10`).
        - **Upper Bound**: If `limit` exceeds `100`, the server automatically caps it at `100`.
        - Computes `skip = (page - 1) * limit`.
        - Computes `totalPages = Math.ceil(totalItems / limit)` and `hasNextPage = page < totalPages`.

        ### Rate Limiting
        - Protected by `getRateLimiter`: Maximum **30 requests per minute** per client IP.
      parameters:
        - name: title
          in: query
          required: false
          description: |
            Case-insensitive substring search for book title.
            Matches any book whose title contains the specified query text.
          schema:
            type: string
          example: clean
        - name: author
          in: query
          required: false
          description: |
            Case-insensitive substring search for author name.
            Matches any book written by an author matching the query string.
          schema:
            type: string
          example: martin
        - name: sort
          in: query
          required: false
          description: |
            Ordering criterion for the returned books:
            - `new`: Newest books first (sorted descending by creation date `-createdAt`).
            - `old`: Oldest books first (sorted ascending by creation date `createdAt`).
            Defaults to `new` if omitted or if an invalid option is provided.
          schema:
            type: string
            enum:
              - new
              - old
            default: new
          example: new
        - name: page
          in: query
          required: false
          description: |
            1-based page number for paginated results.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: |
            Number of book records returned per page. Maximum allowed value is 100.
            Values exceeding 100 are automatically clamped to 100 by the server.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
      responses:
        '200':
          description: Books successfully retrieved with pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllBooksResponse'
              examples:
                booksFound:
                  summary: Books found matching criteria
                  value:
                    status: success
                    length: 2
                    pagination:
                      totalItems: 42
                      totalPages: 5
                      currentPage: 1
                      hasNextPage: true
                    message: all books found
                    data:
                      - _id: 683aab454ae6c56e60594eb7
                        title: 'Clean Code: A Handbook of Agile Software Craftsmanship'
                        author: Robert C. Martin
                        stock: 35
                        description: A comprehensive handbook for software craftsmen containing best practices, principles, and code smells.
                        totalSales: 89
                        price: 38.99
                        category: Self-help
                        coverImage: https://res.cloudinary.com/bookstore/image/upload/v1717145678/BookStore/clean-code.jpg
                        ratingAverage: 4.7
                        ratingQuantity: 112
                        createdAt: '2026-05-30T10:15:30.000Z'
                        isDeleted: false
                      - _id: 683aab454ae6c56e60594eb8
                        title: The Pragmatic Programmer
                        author: Andrew Hunt, David Thomas
                        stock: 20
                        description: 'Your journey to mastery: continuous learning, career growth, and software craft.'
                        totalSales: 64
                        price: 42.5
                        category: Self-help
                        coverImage: https://res.cloudinary.com/bookstore/image/upload/v1717145690/BookStore/pragmatic-programmer.jpg
                        ratingAverage: 4.9
                        ratingQuantity: 95
                        createdAt: '2026-05-28T08:22:15.000Z'
                        isDeleted: false
                emptyResults:
                  summary: No books matched the query filters
                  value:
                    status: success
                    length: 0
                    pagination:
                      totalItems: 0
                      totalPages: 0
                      currentPage: 1
                      hasNextPage: false
                    message: books not found
                    data: []
