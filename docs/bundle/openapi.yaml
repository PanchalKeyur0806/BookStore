              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Internal Server Error
    delete:
      operationId: removeFromWishlist
      security:
        - bearerAuth: []
      tags:
        - wishlist
      summary: Remove a book from the authenticated user's wishlist
      description: |
        Removes a designated book from the authenticated customer's wishlist.

        ### Authentication & Access Control
        - **Required Authentication**: Bearer JWT token (`protect` middleware).
        - **Email Verification**: User account email address must be verified (`isEmailVerified: true`).
        - **Parameter Validation**: Middleware `validateId("bookId")` verifies that `bookId` is a syntactically
          valid 24-character hexadecimal MongoDB ObjectId.

        ### Operational Logic
        1. Executes `Wishlist.findOneAndDelete({ user: req.user._id, book: bookId })`.
        2. If no matching wishlist entry is found for this customer and book, the server responds with
           HTTP `404 Not Found` (`"Book is not in your wishlist"`).
        3. Upon successful removal, responds with HTTP `200 OK`.

        ### Rate Limiting
        - Protected by `generalRateLimiter`: Maximum **15 requests per minute** per client IP.
      responses:
        '200':
          description: Book successfully removed from customer's wishlist.
