components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token used to authenticate protected API requests.

        The token is returned after successful login or OTP verification.

        Send the token using the Authorization header:

        `Authorization: Bearer <JWT_TOKEN>`
  schemas:
    Address:
      type: object
      description: Physical address associated with a user.
      required:
        - street
        - city
        - state
        - zipCode
        - country
      properties:
        line:
          type: string
          description: Additional address information such as an area or locality.
          example: vastral
        street:
          type: string
          description: The user's street or road name.
          example: Dakor
        city:
          type: string
          description: The city where the user resides.
          example: amdavad
        state:
          type: string
          description: The state or province where the user resides.
          example: guj
        zipCode:
          type: integer
          description: Postal or ZIP code associated with the address.
          example: 382418
        country:
          type: string
          description: Country associated with the address.
          example: ind
    RegisterUserRequest:
      type: object
      description: Request payload used to create a new BookStore user account.
      required:
        - name
        - email
        - password
        - dateOfBirth
        - phoneNumber
        - gender
        - address
      properties:
        name:
          type: string
          minLength: 2
          description: The user's full name.
          example: Panchal Keyur
        email:
          type: string
          format: email
          description: Email address used for the user's account.
          example: panchalkeyur.dev@gmail.com
        password:
          type: string
          format: password
          minLength: 8
          description: Password used to authenticate the user.
          example: hello-1234
        dateOfBirth:
          type: string
          format: date
          description: The user's date of birth.
          example: '2005-06-08'
        phoneNumber:
          type: integer
          description: The user's 10-digit phone number.
          example: 1234567890
        gender:
          type: string
          enum:
            - male
            - female
            - others
          description: Gender selected by the user.
          example: male
        address:
          $ref: '#/components/schemas/Address'
    LoginRequest:
      type: object
      description: Request payload used to authenticate an existing user.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email address associated with the user account.
          example: hello-1@gmail.com
        password:
          type: string
          format: password
          description: Password associated with the user account.
          example: hello-1234
    VerifyOtpRequest:
      type: object
      description: Request payload used to verify an OTP.
      required:
        - otp
        - email
      properties:
        otp:
          type: integer
          minimum: 100000
          maximum: 999999
          description: Six-digit OTP sent to the user's email.
          example: 151858
        email:
          type: string
          format: email
          description: Email address associated with the account.
          example: panchalkeyur.dev@gmail.com
    ResendOtpRequest:
      type: object
      description: Request payload used to request a new OTP.
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address associated with the user account.
          example: panchalkeyur.dev@gmail.com
    ForgotPasswordRequest:
      type: object
      description: Request payload used to start the password reset process.
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address associated with the account.
          example: hello-1@gmail.com
    ResetPasswordRequest:
      type: object
      description: Request payload used to set a new password.
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 8
          description: New password that replaces the existing password.
          example: hello-12345
    RegisterUserResponse:
      type: object
      description: Response returned after successfully registering a user.
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: user is registered, otp is being sent to email for verification
        data:
          $ref: '#/components/schemas/User'
    LoginResponse:
      type: object
      description: Response returned after successful authentication.
      required:
        - status
        - token
        - data
      properties:
        status:
          type: string
          example: success
        token:
          type: string
          description: JWT access token.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        data:
          $ref: '#/components/schemas/User'
    VerifyOtpResponse:
      type: object
      description: Response returned after successfully verifying an OTP.
      required:
        - status
        - message
        - token
        - data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: otp verified successfully
