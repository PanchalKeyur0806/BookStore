openapi: 3.1.0
info:
  title: BookStore REST API
  version: 1.0.0
  description: |
    REST API for an online bookstore.

    This API provides authentication, user management, book management,
    cart, favourites, orders, and other bookstore-related functionality.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://bookstore.kplabs.deno.net/
    description: Demo Server
  - url: http://localhost:8002/
    description: Local Server
tags:
  - name: auth
    description: |
      Authentication and account verification endpoints.

      Includes:
      - User registration
      - User login
      - Email OTP verification
      - Resending OTP
      - Forgot password
      - Reset password
  - name: admin
    description: |
      Administrator endpoints for monitoring and managing
      the bookstore application.
  - name: books
    description: |
      Book catalog, inventory, and product management endpoints.

      Includes:
      - Public catalog browsing with title and author regex search
      - Sorting (newest, oldest) and pagination controls
      - Single book lookup with high-speed Redis caching
      - Administrator book creation with Cloudinary cover image upload
      - Administrator book updates with metadata editing and cover image replacement
      - Administrator soft-deletion preserving historical order data
  - name: cart
    description: |
      Shopping cart operations for authenticated customers.

      Includes:
      - Retrieving active user shopping cart with Redis caching
      - Adding books to cart with real-time inventory validation and dynamic pricing recalculation
      - Removing items from cart with automatic price and quantity reconciliation
  - name: orders
    description: |
      Order processing, Stripe checkout, refund requests, and fulfillment tracking.

      Includes:
      - Creating Stripe checkout sessions with inventory reservations and cart conversion
      - Processing customer payment refunds with eligibility verification (7-day window)
      - Administrator platform-wide order monitoring, sorting, and pagination
      - Single order lookup with high-speed Redis caching
      - Stripe payment completion and redirection handling
  - name: reviews
    description: |
      Customer book review and rating management endpoints.

      Includes:
      - Retrieving paginated customer reviews and star ratings for a specific book
      - Submitting customer reviews with automatic book aggregate rating recalculation
      - Updating user reviews and modifying star ratings
      - Deleting customer reviews with automated catalog score reconciliation
      - Administrator catalog-wide review monitoring, searching, and pagination
      - High-performance personal review retrieval with Redis cache-aside caching
  - name: users
    description: |
      User account management, profile settings, order history, and favourites collection.

      Includes:
      - Retrieving authenticated customer profile (`/users/me`)
      - Updating user account information and delivery address (`/users/updateMe`)
      - Retrieving past order history (`/users/orders`)
      - Managing book favourites and wishlist items (`/users/favBooks`)
      - Administrator user catalog querying with multi-field regex filters and pagination (`/users/all`)
      - Administrator single user lookup by ID (`/users/{userId}`)
  - name: wishlist
    description: |
      Customer book wishlist and saved items management endpoints.

      Includes:
      - Retrieving all saved books in customer's wishlist with populated book catalog details (`/wishlist`)
      - Adding books to personal wishlist with real-time catalog existence and duplicate validation (`/wishlist/{bookId}`)
      - Removing books from customer wishlist (`/wishlist/{bookId}`)
paths:
  /auth/register:
    post:
      operationId: registerUser
      security: []
      tags:
        - auth
      summary: Register a new user account
      description: |
        Creates a new customer account in the BookStore database using the supplied personal details,
        contact numbers, date of birth, and physical delivery address.

        Upon account creation:
        1. A user record is persisted in MongoDB with `role: "user"`, `isEmailVerified: false`, `isActive: true`, and an empty cart and favourites list.
        2. A 6-digit numeric verification OTP is generated with a 30-second expiration window (`verificationTokenExpiry`).
        3. An HTML verification email is dispatched via Nodemailer to the user's email address (or development mailbox).
        4. If the email fails to deliver, the newly created user record is rolled back and deleted from the database.
        5. The client must submit the received OTP to `/auth/verifyOtp` within 30 seconds to verify their email and obtain an access token.

        Rate limit: 5 requests per minute.
      requestBody:
        required: true
        description: Personal and delivery details required to register a customer account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            example:
              name: Panchal Keyur
              email: panchalkeyur.dev@gmail.com
              password: hello-1234
              dateOfBirth: '2005-06-08'
              phoneNumber: 1234567890
              gender: male
              address:
                line: vastral
                street: Dakor
                city: amdavad
                state: guj
                zipCode: 382418
                country: ind
      responses:
        '200':
          description: |
            User successfully registered and verification OTP dispatched to email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUserResponse'
              example:
                status: success
                message: user is registered, otp is being sent to email for verification
                data:
                  _id: 6ab8c6b4deb5c92fda07308a
                  name: Panchal Keyur
                  email: panchalkeyur.dev@gmail.com
                  isEmailVerified: false
                  role: user
                  dateOfBirth: '2005-06-08T00:00:00.000Z'
                  phoneNumber: 1234567890
                  gender: male
                  address:
                    line: vastral
                    street: Dakor
                    city: amdavad
                    state: guj
                    zipCode: 382418
                    country: ind
                  isActive: true
                  totalOrderes: 0
                  totalSpent: 0
                  cart: []
                  faviourites: []
                  createdAt: '2026-09-27T07:33:08.757Z'
                  updatedAt: '2026-09-27T07:33:08.757Z'
        '400':
          description: |
            Validation error in submitted registration attributes or failure to dispatch verification email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidName:
                  summary: Name validation error
                  value:
                    status: Error
                    message: please enter correct name
                emptyEmail:
                  summary: Missing email
                  value:
                    status: Error
                    message: email field should not be empty
                invalidEmail:
                  summary: Invalid email format
                  value:
                    status: Error
                    message: please provide valid email address
                missingPassword:
                  summary: Missing password
                  value:
                    status: Error
                    message: please enter correct password
                invalidDateOfBirth:
                  summary: Missing or invalid date of birth
                  value:
                    status: Error
                    message: please enter your date of birth
                invalidPhoneNumber:
                  summary: Phone number not 10 digits
                  value:
                    status: Error
                    message: phoneNumber lenght must be 10 characters
                invalidGender:
                  summary: Invalid gender value
                  value:
                    status: Error
                    message: Invalid gender selection
                emptyAddress:
                  summary: Missing address field
                  value:
                    status: Error
                    message: address field should not be empty
                emailSendFailed:
                  summary: Nodemailer delivery failure
                  value:
                    status: Error
                    message: failed to send an otp, please try again later
        '429':
          description: Rate limit exceeded (maximum 5 requests per minute).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Too many requests. Please try again later
  /auth/login:
    post:
      operationId: loginUser
      security: []
      tags:
        - auth
      summary: Authenticate user and receive JWT access token
      description: |
        Authenticates an existing user account using email and password credentials.

        Authentication flow:
        1. Express-validator checks that email and password fields are present and well-formed.
        2. User is looked up in MongoDB by email address.
        3. check if user account is deactivated, if it is then return error message
        4. The submitted plain password is verified against the bcrypt password hash.
        5. A JSON Web Token (JWT) signed with `JWT_SECRET_KEY` and configured expiration (`JWT_EXPIRES`) is generated containing the user ID payload `{ id: userId }`.
        6. The JWT token and complete user profile are returned to the client.

        Client requests to protected endpoints must supply this token in the header:
        `Authorization: Bearer <JWT_TOKEN>`

        Rate limit: 5 requests per minute.
      requestBody:
        required: true
        description: User credentials for login authentication.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: hello-1@gmail.com
              password: hello-1234
      responses:
        '200':
          description: Authentication successful; JWT access token returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                status: success
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                data:
                  _id: 683aa9c34ae6c56e60594eb2
                  name: hello-1
                  email: hello-1@gmail.com
                  isEmailVerified: true
                  role: user
                  dateOfBirth: '2005-06-08T00:00:00.000Z'
                  phoneNumber: 1234567890
                  gender: male
                  address:
                    line: 6 nilkanth row house
                    street: vastral
                    city: amdavad
                    state: guj
                    zipCode: 382418
                    country: ind
                  isActive: true
                  totalOrderes: 0
                  totalSpent: 0
                  cart: []
                  faviourites:
                    - 6836a66013f0b230bee67c1f
                    - 683697c5c4efe00d7ca88e5a
                  createdAt: '2025-05-31T07:03:31.815Z'
                  updatedAt: '2025-05-31T07:03:31.815Z'
        '400':
          description: Validation error in email or password fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyEmail:
                  summary: Missing email
                  value:
                    status: Error
                    message: email field should not be empty
                invalidEmail:
                  summary: Invalid email format
                  value:
                    status: Error
                    message: please provide valid email address
                missingPassword:
                  summary: Missing password
                  value:
                    status: Error
                    message: please enter correct password
        '401':
          description: Incorrect password supplied for account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPassword:
                  summary: Password incorrect
                  value:
                    status: Error
                    message: your password is incorrect, please enter correct password
                inactiveAccount:
                  summary: Account deactivated
                  value:
                    status: Error
                    message: your account has been deactivated
        '404':
          description: No registered user found matching the provided email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: 'No user found '
        '429':
          description: Rate limit exceeded (maximum 5 requests per minute).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Too many requests. Please try again later
  /auth/verifyOtp:
    post:
      operationId: verifyOtp
      security: []
      tags:
        - auth
      summary: Verify email verification OTP
      description: |
        Verifies the 6-digit one-time password (OTP) sent to the user's email during registration.

        Verification logic:
        1. Client provides `email` and the 6-digit `otp`.
        2. Server checks if the user account exists in MongoDB.
        3. Verifies whether the account is already verified (`isEmailVerified === true`).
        4. Checks whether the OTP has expired (`Date.now() > verificationTokenExpiry`).
        5. Validates the submitted OTP against the stored `emailVerifiedToken`.
        6. Upon successful verification:
           - `isEmailVerified` is updated to `true`.
           - `emailVerifiedToken` and `verificationTokenExpiry` are cleared.
           - A signed JWT access token is minted and returned so the user can immediately interact with protected endpoints.

        Rate limit: 5 requests per minute.
      requestBody:
        required: true
        description: Email address and 6-digit verification OTP.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            example:
              email: panchalkeyur.dev@gmail.com
              otp: 151858
      responses:
        '200':
          description: OTP verified successfully; email marked verified and JWT access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
              example:
                status: success
                message: otp verified successfully
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                data:
                  _id: 6abe528d92d30f6fb4097f64
                  name: Panchal Keyur
                  email: panchalkeyur.dev@gmail.com
                  isEmailVerified: true
                  role: user
                  dateOfBirth: '2005-06-08T00:00:00.000Z'
                  phoneNumber: 1234567890
                  gender: male
                  address:
                    line: near metro station, indiranagar
                    street: 10th main road
                    city: bengaluru
                    state: kar
                    zipCode: 560038
                    country: ind
                  isActive: true
                  totalOrderes: 0
                  totalSpent: 0
                  cart: []
                  faviourites: []
                  createdAt: '2026-10-01T12:31:09.871Z'
                  updatedAt: '2026-10-01T12:31:09.871Z'
        '400':
          description: Missing OTP, user already verified, expired OTP, or incorrect OTP entered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingOtp:
                  summary: Missing OTP
                  value:
                    status: Error
                    message: please provide an otp for verification
                alreadyVerified:
                  summary: User already verified
                  value:
                    status: Error
                    message: user already verified
                expiredOtp:
                  summary: OTP expired (after 30 seconds)
                  value:
                    status: Error
                    message: otp is expired
                incorrectOtp:
                  summary: Incorrect OTP value
                  value:
                    status: Error
                    message: please enter correct otp
        '404':
          description: No account exists matching the provided email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: user does not exists
        '429':
          description: Rate limit exceeded (maximum 5 requests per minute).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Too many requests. Please try again later
  /auth/resendOtp:
    post:
      operationId: resendOtp
      security: []
      tags:
        - auth
      summary: Resend email verification OTP
      description: |
        Generates and sends a new 6-digit verification OTP to the user's registered email address.

        Endpoint rules:
        1. The account must exist in the database.
        2. If the user's email is already verified (`isEmailVerified === true`), resending is rejected with 400.
        3. A fresh OTP is generated with a new 30-second expiry timestamp.
        4. An HTML email with the new OTP is dispatched via Nodemailer.

        Rate limit: 5 requests per minute.
      requestBody:
        required: true
        description: Email address of the unverified customer account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
            example:
              email: panchalkeyur.dev@gmail.com
      responses:
        '200':
          description: New verification OTP sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOtpResponse'
              example:
                status: success
                message: otp is sent to email, please check your email
        '400':
          description: Missing email, user already verified, or email delivery failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingEmail:
                  summary: Missing email address
                  value:
                    status: Error
                    message: please provide your email
                alreadyVerified:
                  summary: User already verified
                  value:
                    status: Error
                    message: user already verified
                emailSendFailed:
                  summary: Nodemailer failure
                  value:
                    status: Error
                    message: failed to send an otp, please try again later
        '404':
          description: No account exists with the provided email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: user not found
        '429':
          description: Rate limit exceeded (maximum 5 requests per minute).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Too many requests. Please try again later
  /auth/forgotpassword:
    post:
      operationId: forgotPassword
      security:
        - bearerAuth: []
      tags:
        - auth
      summary: Request password reset email link
      description: |
        Generates a secure password reset token and emails a reset link to the user.

        Security & controller requirements:
        1. **Protected Route**: Requires a valid JWT Bearer token in the `Authorization` header (`protect` middleware).
        2. The authenticated user must have a verified email address (`isEmailVerified === true`).
        3. The email to reset is provided in the request body.
        4. A 32-byte cryptographically secure random token is generated and SHA-256 hashed into `passwordResetToken` on the user record.
        5. The reset token has a 30-second expiry (`passwordExpires = Date.now() + 30 * 1000`).
        6. An email containing the password reset link `${protocol}://${host}/auth/resetPassword/${resetToken}` is sent to the customer.

        Rate limit: 5 requests per minute.
      requestBody:
        required: true
        description: Email address of the account requesting password reset.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: panchalkeyur.dev@gmail.com
      responses:
        '200':
          description: Password reset email successfully dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
              example:
                status: success
                message: email send successfully
        '400':
          description: Missing authentication token, missing email, user not found, or email dispatch failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tokenMissingHeader:
                  summary: Missing Bearer token header
                  value:
                    status: Error
                    message: Token not found please register first
                emptyBearerToken:
                  summary: Empty Bearer token
                  value:
                    status: Error
                    message: Please login to access this page
                missingEmail:
                  summary: Missing email in request body
                  value:
                    status: Error
                    message: please provide email address
                userNotFound:
                  summary: User not found for email
                  value:
                    status: Error
                    message: user not found
                emailSendFailed:
                  summary: Nodemailer failure
                  value:
                    status: Error
                    message: Error occured while sending email, please try again later
        '403':
          description: Authenticated user's email address has not been verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: you are not verified, please verified first then try again
        '404':
          description: User associated with JWT token no longer exists in database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: user not found, please register first
        '429':
          description: Rate limit exceeded (maximum 5 requests per minute).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Too many requests. Please try again later
  /auth/resetpassword/{token}:
    post:
      operationId: resetPassword
      security:
        - bearerAuth: []
      tags:
        - auth
      summary: Reset user password using reset token
      description: |
        Changes the user's password using the unhashed password reset token received via email.

        Flow & controller requirements:
        1. **Protected Route**: Requires a valid JWT Bearer token in the `Authorization` header (`protect` middleware).
        2. The reset token is supplied as a URL path parameter `:token`.
        3. The server hashes `:token` with SHA-256 and searches for a user where `passwordResetToken` matches and `passwordExpires > Date.now()`.
        4. If the token is invalid or expired (30-second lifespan), an error is returned.
        5. The new `password` is set, `passwordResetToken` and `passwordExpires` are cleared to `undefined`, and the user document is saved (which triggers bcrypt hashing via Mongoose `pre('save')`).

        Rate limit: 5 requests per minute.
      parameters:
        - name: token
          in: path
          required: true
          description: Unhashed password reset token string extracted from the email link.
          schema:
            type: string
          example: a1b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef0
      requestBody:
        required: true
        description: The new password to replace the current password.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              password: hello-1234
      responses:
        '200':
          description: Password reset successfully completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
              example:
                status: success
                message: password chagned successfully
        '400':
          description: Missing authentication token, missing password, or invalid/expired reset token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tokenMissingHeader:
                  summary: Missing Bearer token header
                  value:
                    status: Error
                    message: Token not found please register first
                emptyBearerToken:
                  summary: Empty Bearer token
                  value:
                    status: Error
                    message: Please login to access this page
                missingPassword:
                  summary: Missing password in body
                  value:
                    status: Error
                    message: please provide your password
                tokenInvalidOrExpired:
                  summary: Reset token invalid or expired
                  value:
                    status: Error
                    message: user not found
        '403':
          description: Authenticated user's email address has not been verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: you are not verified, please verified first then try again
        '404':
          description: User associated with JWT token no longer exists in database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: user not found, please register first
        '429':
          description: Rate limit exceeded (maximum 5 requests per minute).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Too many requests. Please try again later
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      security:
        - bearerAuth: []
      tags:
        - admin
      summary: Get admin dashboard statistics
      description: |
        Retrieves aggregated key performance statistics for the administrator dashboard.

        The dashboard aggregates:
        - Total revenue from non-cancelled orders
        - Total count of orders (all statuses)
        - Total books Ordered in system
        - Total sales and order count for the current month
        - Total sales and order count for the current year
        - Daily paid sales for the last 30 days
        - Best-selling book (by units sold and revenue)
        - Total registered users count
        - New users registered during the current month
        - User distribution by non-admin roles (user, seller, etc.)
        - Orders grouped by order status (paid, pending, cancelled, etc.)
        - Pending orders count
        - Books with low inventory (stock <= 10)

        Rate limit: 30 requests per minute.
      responses:
        '200':
          description: Dashboard statistics retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
              example:
                status: success
                salesData:
                  totalRevenue:
                    total: 125000
                  totalOrders:
                    total: 250
                  totalBooks:
                    total: 85
                  monthlyTotal:
                    total: 18500
                    count: 42
                  yearlyTotal:
                    total: 125000
                    count: 250
                  dailySales:
                    - date: '2026-09-27'
                      sales: 1250
                      count: 5
                    - date: '2026-09-28'
                      sales: 2100
                      count: 8
                  topBook:
                    bookId: 6ab8c6b4deb5c92fda07308a
                    title: Clean Code
                    totalSold: 45
                    revenue: 13500
                userStats:
                  totalUsers:
                    count: 450
                  newUserThisMonth:
                    count: 38
                  userByRoles:
                    - role: user
                      count: 420
                    - role: seller
                      count: 30
                orderStats:
                  orderByStatus:
                    - orderStatus: paid
                      count: 210
                    - orderStatus: pending
                      count: 25
                    - orderStatus: cancelled
                      count: 15
                  pendingOrders:
                    count: 25
                lowInventory:
                  - title: Clean Code
                    author: Robert C. Martin
                    stock: 5
                  - title: The Pragmatic Programmer
                    author: Andrew Hunt
                    stock: 8
        '401':
          description: Authentication token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Please login to access this page
        '403':
          description: Authenticated user does not have administrator privileges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: you are not allowed to perform this action
        '429':
          description: Rate limit exceeded (30 requests per minute).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Too many requests. Please try again later
  /admin/getSalesAnalytics:
    get:
      operationId: getSalesAnalytics
      security:
        - bearerAuth: []
      tags:
        - admin
      summary: Get sales and revenue analytics
      description: |
        Retrieves aggregated sales metrics for non-cancelled orders grouped by day, week, or month.

        Optional query parameters allow filtering by date range (`startDate` and `endDate`)
        and selecting the aggregation period (`groupBy`):
        - `day`: Groups data daily (YYYY-MM-DD) [default]
        - `week`: Groups data weekly (YYYY-Www)
        - `month`: Groups data monthly (YYYY-MM)

        For each time bucket, the response returns:
        - `totalRevenue`: Sum of total prices
        - `avgRevenue`: Average order value
        - `totalOrders`: Count of orders
        - `totalItems`: Total quantity of books purchased

        Rate limit: 30 requests per minute.
      parameters:
        - name: startDate
          in: query
          required: false
          description: Earliest order creation date to include (inclusive).
          schema:
            type: string
            format: date
          example: '2026-01-01'
        - name: endDate
          in: query
          required: false
          description: Latest order creation date to include (inclusive).
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: groupBy
          in: query
          required: false
          description: Time-series bucket granularity.
          schema:
            type: string
            enum:
              - day
              - week
              - month
            default: day
          example: day
      responses:
        '200':
          description: Sales analytics retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesAnalyticsResponse'
              example:
                status: success
                data:
                  - _id: '2026-10-01'
                    totalRevenue: 4500
                    avgRevenue: 450
                    totalOrders: 10
                    totalItems: 18
                  - _id: '2026-09-30'
                    totalRevenue: 3200
                    avgRevenue: 400
                    totalOrders: 8
                    totalItems: 12
        '401':
          description: Authentication token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Please login to access this page
        '403':
          description: Authenticated user does not have administrator privileges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: you are not allowed to perform this action
        '429':
          description: Rate limit exceeded (30 requests per minute).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: Error
                message: Too many requests. Please try again later
