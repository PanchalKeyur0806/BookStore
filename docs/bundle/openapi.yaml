  /orders/checkout-session:
    post:
      operationId: checkoutsession
      security:
        - bearerAuth: []
      tags:
        - orders
      summary: Create a Stripe checkout session for the authenticated user's cart
      description: |
        Initializes a secure, Stripe-hosted payment checkout session for all books currently stored
        in the authenticated customer's shopping cart.

        ### Authentication & Access Control
        - **Required Authentication**: Bearer JWT token in the `Authorization` header (`protect` middleware).
        - **Role Restriction**: Strictly restricted to customers with `role: 'user'` (`restrictTo("user")`).
        - **Email Verification**: User account email address must be verified (`isEmailVerified: true`).

        ### Complete Checkout & Inventory Lifecycle
        1. **User & Cart Lookup**:
           Retrieves the customer document and active cart via `Cart.findOne({ user: req.user.id })`
           with populated book details (`populate("items.book")`). If no cart exists, returns HTTP `404 Not Found`.
        2. **Inventory Stock Validation & Reservation (`makeReservation` middleware)**:
           - Inspects every item in the cart against active inventory in the `Books` collection (`Books.findById(item.book)`).
           - If any requested quantity exceeds currently available inventory (`book.stock < item.quantity`),
             checkout halts immediately with HTTP `400 Bad Request` (`"We have only [stock] of [title] left"`).
           - Deletes any prior unfulfilled reservation for this user (`Reservation.findByIdAndDelete`).
           - Creates a new temporary reservation record in MongoDB (`Reservation.create`) to hold inventory
             while payment is processed.
        3. **Stripe Checkout Session Creation**:
           - Converts line items into Stripe line item format with `currency: "inr"`, book title, unit amount
             (price converted to paise: `unit_amount = book.price * 100`), and quantity.
           - Calls `stripe.checkout.sessions.create` configured with `mode: "payment"` and `payment_method_types: ["card"]`.
           - Dynamic redirect callback URLs:
             - `success_url`: `{host}/orders/success?session_id={CHECKOUT_SESSION_ID}`
             - `cancel_url`: `{host}/orders/cancel`
        4. **Asynchronous Order Fulfillment via Queue (`orderQueue`)**:
           - Upon successful payment authorization, Stripe dispatches a `checkout.session.completed` webhook event.
           - The webhook handler enqueues an `order-processing` background job into BullMQ `orderQueue`.
           - A dedicated worker processes the session: generates the final `Order` record, marks the cart
             `isOrdered: true`, decrements book stock, updates sales metrics, and cleans up the reservation.

        ### Rate Limiting
        - Protected by `mutationLimiter`: Maximum **10 mutation requests per minute** per client IP.
      responses:
        '200':
          description: Stripe checkout session successfully initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
              example:
                status: success
                url: https://checkout.stripe.com/c/pay/cs_test_a1b2c3d4e5f67890
                data:
                  id: cs_test_a1b2c3d4e5f67890
                  object: checkout.session
                  customer_email: customer@example.com
                  mode: payment
                  payment_status: unpaid
                  url: https://checkout.stripe.com/c/pay/cs_test_a1b2c3d4e5f67890
        '400':
