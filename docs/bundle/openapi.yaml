            encoding:
              coverImage:
                contentType: image/png, image/jpeg, image/webp
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
            example:
              price: 21.99
              stock: 65
              description: Updated edition with new exercises and best practices for modern software development.
