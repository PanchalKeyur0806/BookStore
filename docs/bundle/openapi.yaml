  /cart/add:
    post:
      operationId: addToCart
      security:
        - bearerAuth: []
      tags:
        - cart
      summary: Add a book to the shopping cart or increment quantity
      description: |
        Adds a specified quantity of a book to the authenticated customer's shopping cart.

        If a cart does not yet exist for the user, a new one is initialized. If the item
        is already in the cart, its quantity is increased and financial totals are recalculated.
        Synchronizes changes with Redis caching.

        This endpoint requires authentication and is restricted to customers with `role: 'user'`.

        ### In-Depth Business & Controller Logic
        1. **Input Extraction**:
           - Extracts `bookId` and `quantity` from request body.
           - Extracts `userId` from authenticated `req.user.id`.
        2. **Inventory Stock Pre-Check**:
           - Queries `Books.findById(bookId)`.
           - Verifies that `book.stock >= quantity`. If the requested quantity exceeds total book stock,
             rejects immediately with HTTP `400 Bad Request`:
             `"No book stock is available yet, please contact admin to futher information"`.
        3. **Cart Discovery & Evaluation**:
           - Queries MongoDB for an existing cart via `Cart.findOne({ user: userId })`.
        4. **Branch A: Cart Does Not Exist**:
           - Initializes a new Cart document:
             ```json
             {
               "user": "userId",
               "items": [{ "book": "bookId", "quantity": quantity }],
               "totalQuantity": quantity,
               "totalPrice": book.price * quantity
             }
             ```
        5. **Branch B: Cart Already Exists**:
           - Searches for `bookId` within `cart.items`:
             - **Case 1: Book already exists in cart (`index > -1`)**:
               - Calculates `newTotalQty = existingQty + quantity`.
               - Stock Validation: If `newTotalQty > book.stock`, rejects with HTTP `400 Bad Request`:
                 `"Only <availableStock> more units available"`.
               - Increments item quantity: `cart.items[index].quantity += quantity`.
               - Increments totals: `cart.totalQuantity += quantity`, `cart.totalPrice += book.price * quantity`.
             - **Case 2: Book is new to this existing cart (`index === -1`)**:
               - Stock Validation: If `quantity > book.stock`, rejects with HTTP `400 Bad Request`:
                 `"Only <availableStock> more units available"`.
               - Pushes new item to `cart.items`: `{ book: bookId, quantity }`.
               - Increments totals: `cart.totalQuantity += quantity`, `cart.totalPrice += book.price * quantity`.
        6. **Persistence & Cache Sync**:
           - Persists cart to MongoDB: `await cart.save()`.
           - Updates Redis cache key `user:{userId}:cart` with the newly saved cart JSON.
        7. **Response**:
           - Returns HTTP `200 OK` with `{ status: "success", message: "added to cart", data: cart }`.

        ### Rate Limiting
        - Protected by `mutationLimiter`: Maximum **10 mutations per minute** per client IP.
      requestBody:
        required: true
        description: Book identifier and quantity to add to the cart.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
            example:
              bookId: 683aab454ae6c56e60594eb7
              quantity: 2
      responses:
        '200':
          description: Item added or incremented in cart successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              example:
                status: success
                message: added to cart
                data:
                  _id: 683aacc04ae6c56e60594eb8
                  user: 683aa9c34ae6c56e60594eb2
                  items:
                    - _id: 683aae014ae6c56e60594eb9
                      book: 683aab454ae6c56e60594eb7
                      quantity: 2
                  totalPrice: 49.98
                  totalQuantity: 2
                  isOrdered: false
        '400':
          description: Insufficient inventory stock or validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noStockAvailable:
                  summary: Book inventory is lower than requested quantity
                  value:
                    status: Error
                    message: No book stock is available yet, please contact admin to futher information
                exceedsStockIncrement:
                  summary: Additional quantity exceeds remaining stock for existing cart item
                  value:
                    status: Error
                    message: Only 3 more units available
                exceedsStockNewItem:
                  summary: Requested quantity exceeds total stock for new item
                  value:
                    status: Error
                    message: Only 5 more units available
        '401':
          description: Missing or invalid JWT authentication token.
          content:
            application/json:
