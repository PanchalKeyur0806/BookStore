  /orders/refundPayment/{stripePaymentId}:
    parameters:
      - name: stripePaymentId
        in: path
        required: true
        description: |
          The Stripe Payment Intent identifier associated with the order (e.g., `pi_3Nz...`).
        schema:
          type: string
        example: pi_3NzABC1234567890XYZ
    get:
      operationId: refundPayments
      security:
        - bearerAuth: []
      tags:
        - orders
      summary: Request a Stripe payment refund for an eligible paid order
      description: |
        Initiates a customer payment refund through the Stripe payment gateway for a completed order.

        ### Authentication & Access Control
        - **Required Authentication**: Bearer JWT token (`protect` middleware).
        - **Role Restriction**: Strictly restricted to customers with `role: 'user'` (`restrictTo("user")`).
        - **Email Verification**: User account email address must be verified (`isEmailVerified: true`).

        ### Eligibility Criteria & Validation Rules (`checkRefundStatus` middleware)
        1. **Order Ownership Verification**:
           Queries MongoDB for an order where `paymentInfo.stripePaymentId` matches the path parameter
           and `user` matches the authenticated customer (`req.user._id`).
           If no matching order is found, returns HTTP `404 Not Found` (`"Order not found"`).
        2. **7-Day Cancellation Window Enforcement**:
           Refunds are strictly permitted within **168 hours (7 calendar days)** of order payment (`paidAt`).
           If `todayDate > (paidAt + 168 hours)`, the request is rejected with HTTP `400 Bad Request`
           (`"date is passed, you can't make a refund request"`).
        3. **Order Status Requirement**:
           The order must be in `"paid"` status. Unpaid, pending, or already cancelled orders cannot be refunded
           (`"This payment cannot be refunded"`).

        ### Refund Execution & Catalog Reconciliation
        - Invokes `stripe.refunds.create({ payment_intent: stripePaymentId, reason: "requested_by_customer" })`.
        - **Automated Webhook Synchronization (`charge.refunded`)**:
          Upon Stripe refund confirmation, the incoming webhook handler:
          - Updates order status: `orderStatus = "cancelled"`, `paymentInfo.status = "cancelled"`.
          - Executes Mongoose `bulkWrite` to replenish catalog stock (`stock += quantity`) and decrement
            revenue figures (`totalSales -= salesAmount`) on affected `Books` documents.

        ### Rate Limiting
        - Protected by rate limiting: Maximum **30 requests per minute** per client IP.
      responses:
        '200':
          description: Payment refund successfully processed through Stripe gateway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundPaymentResponse'
              example:
                status: success
                message: payment refund successfull
                data:
                  id: re_3NzABC1234567890XYZ
                  object: refund
                  amount: 125000
                  currency: inr
                  payment_intent: pi_3NzABC1234567890XYZ
                  status: succeeded
                  reason: requested_by_customer
        '400':
          description: Order ineligible for refund (cancellation window expired or invalid status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                windowExpired:
                  summary: Refund requested after 7-day policy window
                  value:
                    status: Error
                    message: date is passed, you can't make a refund request
                invalidOrderStatus:
                  summary: Order is not in paid status
                  value:
                    status: Error
                    message: This payment cannot be refunded
        '401':
          description: Missing or invalid JWT authentication token.
          content:
