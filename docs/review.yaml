# ============================================================
# 4. /reviews/{bookId}/me (GET - Redis Cache-Aside Lookup)
# ============================================================
getMyReview:
  parameters:
    - name: bookId
      in: path
      required: true
      description: |
        The 24-character hexadecimal MongoDB ObjectId uniquely identifying the book.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
      example: "683aab454ae6c56e60594eb7"

  get:
    operationId: getOneReview
    security:
      - bearerAuth: []
    tags:
      - reviews

    summary: Retrieve current user's review for a book (with Redis caching)

    description: |
      Retrieves the specific review and rating written by the authenticated customer
      for the designated book, utilizing a high-performance Redis cache-aside caching pattern.

      ### Authentication & Access Control
      - **Required Authentication**: Bearer JWT token (`protect` middleware).
      - **Role Restriction**: Accessible only to customers holding `role: 'user'` (`restrictTo("user")`).
      - **Email Verification**: User account email address must be verified (`isEmailVerified: true`).
      - **Parameter Validation**: Middleware `validateId("bookId")` validates that `bookId` is a valid
        24-character hexadecimal MongoDB ObjectId before controller execution.

      ### High-Performance Redis Cache-Aside Architecture
      1. **Cache Lookup**:
         Checks Redis for key `user:{userId}:book:{bookId}` using `client.get(...)`.
      2. **Cache Hit**:
         - Returns cached serialized review immediately from Redis memory without querying MongoDB.
         - Responds with HTTP `200 OK`:
           `{ status: "success", message: "review found successfully", data: JSON.parse(reviewData) }`.
      3. **Cache Miss**:
         - Queries MongoDB for an existing review via `Review.findOne({ book: bookId, user: req.user.id })`.
         - If no review exists, aborts with HTTP `404 Not Found` (`"Review not found"`).
         - If found:
           - Serializes the review document and writes it to Redis key `user:{userId}:book:{bookId}`.
           - Responds with HTTP `200 OK`: `{ status: "success", data: review }`.

      ### Rate Limiting
      - Protected by `getRateLimiter`: Maximum **30 requests per minute** per client IP.

    responses:
      "200":
        description: Review retrieved successfully (from Redis cache or MongoDB).
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/GetMyReviewResponse"
            examples:
              redisCacheHit:
                summary: Fast lookup served from Redis cache
                value:
                  status: "success"
                  message: "review found successfully"
                  data:
                    _id: "683ab1234ae6c56e60594eca"
                    review: "An exceptional, comprehensive guide to clean architecture and readable code."
                    rating: 5
                    user:
                      _id: "683aa9c34ae6c56e60594eb2"
                      name: "Keyur Panchal"
                    book:
                      _id: "683aab454ae6c56e60594eb7"
                      title: "Clean Code"
                    createdAt: "2026-05-12T10:00:00.000Z"
                    updatedAt: "2026-05-12T10:00:00.000Z"
              databaseHit:
                summary: Initial lookup fetched from MongoDB and populated into Redis cache
                value:
                  status: "success"
                  data:
                    _id: "683ab1234ae6c56e60594eca"
                    review: "An exceptional, comprehensive guide to clean architecture and readable code."
                    rating: 5
                    user:
                      _id: "683aa9c34ae6c56e60594eb2"
                      name: "Keyur Panchal"
                    book:
                      _id: "683aab454ae6c56e60594eb7"
                      title: "Clean Code"
                    createdAt: "2026-05-12T10:00:00.000Z"
                    updatedAt: "2026-05-12T10:00:00.000Z"

      "400":
        description: Malformed MongoDB ObjectId syntax in path parameter.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Invalid Id, please enter correct id"

      "401":
        description: Missing or invalid JWT authentication token.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            examples:
              missingToken:
                summary: Bearer token omitted
                value:
                  status: "Error"
                  message: "Token not found please register first"
              invalidToken:
                summary: Token invalid or expired
                value:
                  status: "Error"
                  message: "Please login to access this page"

      "403":
        description: Authenticated user is unverified or lacks customer privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            examples:
              nonUserRole:
                summary: User does not hold customer role
                value:
                  status: "Error"
                  message: "you are not allowed to perform this action"
              unverifiedAccount:
                summary: User email is not verified
                value:
                  status: "Error"
                  message: "you are not verified, please verified first then try again"

      "404":
        description: Review not found or book identifier omitted.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            examples:
              reviewNotFound:
                summary: User has not reviewed this book
                value:
                  status: "Error"
                  message: "Review not found"
              missingBookId:
                summary: Book ID not found
                value:
                  status: "Error"
                  message: "Book id not found"

      "429":
        description: Rate limit exceeded (30 requests per minute).
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Too many requests. Please try again later"

      "500":
        description: Internal server error.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Internal Server Error"