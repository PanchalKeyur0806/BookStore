# ============================================================
# 3. /reviews/all (GET - Admin Catalog Oversight)
# ============================================================
getAllReviews:
  get:
    operationId: getAllReviews
    security:
      - bearerAuth: []
    tags:
      - reviews

    summary: Retrieve all catalog reviews across all books (Admin only)

    description: |
      Provides comprehensive administrative oversight of all customer reviews submitted
      across the bookstore catalog.

      ### Authentication & Access Control
      - **Required Authentication**: Bearer JWT token (`protect` middleware).
      - **Role Restriction**: Strictly restricted to users holding `role: 'admin'` (`restrictTo("admin")`).
      - **Email Verification**: Admin account email address must be verified (`isEmailVerified: true`).

      ### Search & Filtering Capabilities
      - **Keyword Search (`msg`)**: Optional case-insensitive regular expression substring filter
        (`{ review: { $regex: msg, $options: "i" } }`) searched across all review bodies in the database.
      - **Catalog-wide Scope**: Unlike the book-specific review endpoint, this queries all reviews
        without filtering by a specific book ID.

      ### Sorting Behavior
      - `sort=new` (default): Sorts descending by `-createdAt` (most recently submitted reviews first).
      - `sort=old`: Sorts ascending by `createdAt` (oldest reviews first).
      - Any unrecognized or omitted sort option automatically defaults to `new`.

      ### Pagination Rules
      - `page`: 1-based page index (defaults to `1`).
      - `limit`: Number of records returned per page (defaults to `10`).
      - **Upper Bound**: If `limit` exceeds `100`, the server automatically caps it at `100`.
      - Computes `skip = (page - 1) * limit`.
      - Computes `totalPages = Math.ceil(totalItems / limit)` and `hasNextPage = page < totalPages`.

      ### Data Population
      - Automatically populates the author's public name (`user: { _id, name }`) and book title
        (`book: { _id, title }`) via Mongoose `pre(/^find/)` query middleware.

      ### Rate Limiting
      - Protected by `getRateLimiter`: Maximum **30 requests per minute** per client IP.

    parameters:
      - name: page
        in: query
        required: false
        description: 1-based page index for pagination. Defaults to 1.
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1

      - name: limit
        in: query
        required: false
        description: |
          Number of review records to return per page. Defaults to 10.
          Automatically clamped to a maximum of 100 by the server.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        example: 10

      - name: sort
        in: query
        required: false
        description: |
          Chronological ordering of reviews:
          - `new`: Newest reviews first (descending by `-createdAt`).
          - `old`: Oldest reviews first (ascending by `createdAt`).
          Defaults to `new` if omitted or invalid.
        schema:
          type: string
          enum:
            - new
            - old
          default: new
        example: "new"

      - name: msg
        in: query
        required: false
        description: |
          Case-insensitive substring search filter matching text within the review commentary.
        schema:
          type: string
        example: "practical"

    responses:
