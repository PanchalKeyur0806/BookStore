                totalPages: 5
                currentPage: 1
                hasNextPage: true
              length: 10
              data:
                - _id: "683ab1234ae6c56e60594eca"
                  review: "An exceptional, comprehensive guide to clean architecture and readable code."
                  rating: 5
                  user:
                    _id: "683aa9c34ae6c56e60594eb2"
                    name: "Keyur Panchal"
                  book:
                    _id: "683aab454ae6c56e60594eb7"
                    title: "Clean Code"
                  createdAt: "2026-05-12T10:00:00.000Z"
                  updatedAt: "2026-05-12T10:00:00.000Z"
                - _id: "683ab1234ae6c56e60594ecc"
                  review: "A masterpiece of system architecture and concurrency patterns."
                  rating: 5
                  user:
                    _id: "683aa9c34ae6c56e60594eb6"
                    name: "Alex Johnson"
                  book:
                    _id: "683aab454ae6c56e60594eb9"
                    title: "Designing Data-Intensive Applications"
                  createdAt: "2026-05-11T09:15:00.000Z"
                  updatedAt: "2026-05-11T09:15:00.000Z"

      "401":
        description: Missing or invalid JWT authentication token.
        content:
