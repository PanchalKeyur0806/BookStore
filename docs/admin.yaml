# admin.yaml
#
# Administrator-related API routes for the BookStore REST API.
#
# This file contains Path Item Objects that can be referenced
# individually from the root openapi.yaml file.
#
# All endpoints require an authenticated user with administrator privileges (role: 'admin').

# ============================================================
# 1. ADMIN DASHBOARD
# ============================================================
dashboard:
  get:
    operationId: getAdminDashboard
    security:
      - bearerAuth: []
    tags:
      - admin

    summary: Get admin dashboard statistics

    description: |
      Retrieves aggregated key performance statistics for the administrator dashboard.

      The dashboard aggregates:
      - Total revenue from non-cancelled orders
      - Total count of orders (all statuses)
      - Total books Ordered in system
      - Total sales and order count for the current month
      - Total sales and order count for the current year
      - Daily paid sales for the last 30 days
      - Best-selling book (by units sold and revenue)
      - Total registered users count
      - New users registered during the current month
      - User distribution by non-admin roles (user, seller, etc.)
      - Orders grouped by order status (paid, pending, cancelled, etc.)
      - Pending orders count
      - Books with low inventory (stock <= 10)

      Rate limit: 30 requests per minute.

    responses:
      "200":
        description: Dashboard statistics retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/AdminDashboardResponse"
            example:
              status: "success"
              salesData:
                totalRevenue:
                  total: 125000
                totalOrders:
                  total: 250
                totalBooks:
                  total: 85
                monthlyTotal:
                  total: 18500
                  count: 42
                yearlyTotal:
                  total: 125000
                  count: 250
                dailySales:
                  - date: "2026-09-27"
                    sales: 1250
                    count: 5
                  - date: "2026-09-28"
                    sales: 2100
                    count: 8
                topBook:
                  bookId: "6ab8c6b4deb5c92fda07308a"
                  title: "Clean Code"
                  totalSold: 45
                  revenue: 13500
              userStats:
                totalUsers:
                  count: 450
                newUserThisMonth:
                  count: 38
                userByRoles:
                  - role: "user"
                    count: 420
                  - role: "seller"
                    count: 30
              orderStats:
                orderByStatus:
                  - orderStatus: "paid"
                    count: 210
                  - orderStatus: "pending"
                    count: 25
                  - orderStatus: "cancelled"
                    count: 15
                pendingOrders:
                  count: 25
              lowInventory:
                - title: "Clean Code"
                  author: "Robert C. Martin"
                  stock: 5
                - title: "The Pragmatic Programmer"
                  author: "Andrew Hunt"
                  stock: 8

      "401":
        description: Authentication token missing or invalid.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Please login to access this page"

      "403":
        description: Authenticated user does not have administrator privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "you are not allowed to perform this action"

      "429":
        description: Rate limit exceeded (30 requests per minute).
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Too many requests. Please try again later"

# ============================================================
# 2. SALES ANALYTICS
# ============================================================
salesAnalytics:
  get:
    operationId: getSalesAnalytics
    security:
      - bearerAuth: []
    tags:
      - admin

    summary: Get sales and revenue analytics

    description: |
      Retrieves aggregated sales metrics for non-cancelled orders grouped by day, week, or month.

      Optional query parameters allow filtering by date range (`startDate` and `endDate`)
      and selecting the aggregation period (`groupBy`):
      - `day`: Groups data daily (YYYY-MM-DD) [default]
      - `week`: Groups data weekly (YYYY-Www)
      - `month`: Groups data monthly (YYYY-MM)

      For each time bucket, the response returns:
      - `totalRevenue`: Sum of total prices
      - `avgRevenue`: Average order value
      - `totalOrders`: Count of orders
      - `totalItems`: Total quantity of books purchased

      Rate limit: 30 requests per minute.

    parameters:
      - name: startDate
        in: query
        required: false
        description: Earliest order creation date to include (inclusive).
        schema:
          type: string
          format: date
        example: "2026-01-01"

      - name: endDate
        in: query
        required: false
        description: Latest order creation date to include (inclusive).
        schema:
          type: string
          format: date
        example: "2026-10-01"

      - name: groupBy
        in: query
        required: false
        description: Time-series bucket granularity.
        schema:
          type: string
          enum:
            - day
            - week
            - month
          default: day
        example: "day"

    responses:
      "200":
        description: Sales analytics retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/SalesAnalyticsResponse"
            example:
              status: "success"
              data:
                - _id: "2026-10-01"
                  totalRevenue: 4500
                  avgRevenue: 450
                  totalOrders: 10
                  totalItems: 18
                - _id: "2026-09-30"
                  totalRevenue: 3200
                  avgRevenue: 400
                  totalOrders: 8
                  totalItems: 12

      "401":
        description: Authentication token missing or invalid.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Please login to access this page"

      "403":
        description: Authenticated user does not have administrator privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "you are not allowed to perform this action"

      "429":
        description: Rate limit exceeded (30 requests per minute).
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Too many requests. Please try again later"

