# ============================================================
# 10. ORDER GROWTH
# ============================================================
orderGrowth:
  get:
    operationId: getOrderGrowth
    security:
      - bearerAuth: []
    tags:
      - admin

    summary: Get daily order growth over a date range (up to 90 days)

    description: |
      Provides day-by-day order counts between `startDate` and `endDate`.

      Validations enforced:
      - Both `startDate` and `endDate` are required.
      - `startDate` cannot be later than `endDate`.
      - The time difference between the dates cannot exceed 90 days.

      Days without any order activity are automatically densified with a count of 0.

    parameters:
      - name: startDate
        in: query
        required: true
        description: Start date (YYYY-MM-DD).
        schema:
          type: string
          format: date
        example: "2026-09-01"

      - name: endDate
        in: query
        required: true
        description: End date (YYYY-MM-DD, within 90 days of startDate).
        schema:
          type: string
          format: date
        example: "2026-09-30"

    responses:
      "200":
        description: Daily order growth timeline retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/OrderGrowthResponse"
            example:
              status: "success"
              data:
                - date: "2026-09-01"
                  totalOrders: 12
                - date: "2026-09-02"
                  totalOrders: 8
                - date: "2026-09-03"
                  totalOrders: 0

      "400":
        description: Validation error in date parameters (e.g. missing dates, start > end, or difference > 90 days).
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            examples:
              missingDates:
                summary: Missing date parameters
                value:
                  status: "Error"
                  message: "Please enter start and end date"
              rangeExceeded:
                summary: Range exceeds 90 days
                value:
                  status: "Error"
                  message: "Difference of date should not be bigger than 90 days"

      "401":
        description: Authentication token missing or invalid.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Please login to access this page"

      "403":
        description: Authenticated user does not have administrator privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "you are not allowed to perform this action"

# ============================================================
# 11. AVERAGE ORDER VALUE (AOV)
# ============================================================
averageOrderValue:
  get:
    operationId: getAverageOrderValue
    security:
      - bearerAuth: []
    tags:
      - admin

    summary: Get monthly average order value (AOV) and revenue trends

    description: |
      Calculates the monthly average order value (`avgOrderValue`), count of completed paid orders (`completedOrders`),
      and total revenue for paid orders within the specified date range.

      Validations enforced:
      - `startDate` and `endDate` are required.
      - `endDate` must be strictly after `startDate`.
      - Date range cannot exceed 1 year.

      Months with zero orders return 0 for revenue and average order value.

    parameters:
      - name: startDate
        in: query
        required: true
        description: Start date (YYYY-MM-DD).
        schema:
          type: string
          format: date
        example: "2026-01-01"

      - name: endDate
        in: query
        required: true
        description: End date (YYYY-MM-DD, within 1 year from startDate).
        schema:
          type: string
          format: date
        example: "2026-10-01"

    responses:
      "200":
        description: Monthly average order value statistics retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/AverageOrderValueResponse"
            example:
              status: "success"
              data:
                - month: "2026-01"
                  completedOrders: 45
                  totalRevenue: 20250
                  avgOrderValue: 450
                - month: "2026-02"
                  completedOrders: 50
                  totalRevenue: 24000
                  avgOrderValue: 480

      "400":
        description: Validation error in date parameters.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            examples:
              missingDates:
                summary: Missing date parameters
                value:
                  status: "Error"
                  message: "please enter start and end date"
              rangeExceeded:
                summary: Range exceeds one year
                value:
                  status: "Error"
                  message: "The date range cannot exceed one year"

      "401":
        description: Authentication token missing or invalid.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Please login to access this page"

      "403":
        description: Authenticated user does not have administrator privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "you are not allowed to perform this action"

# ============================================================
# 12. CUSTOMER ANALYTICS
# ============================================================
customerAnalytics:
  get:
    operationId: getCustomerAnalytics
    security:
      - bearerAuth: []
    tags:
      - admin

    summary: Get customer growth, top-spending customers, and returning customer rate

    description: |
      Provides in-depth customer engagement and retention statistics:
      1. `userAnalytics`: Monthly count of newly registered users over the date range (densified with 0).
      2. `topPayingCustomers`: Top 10 customers ranked by total money spent on completed paid orders.
      3. `returningCustomers`: Total unique buyers, count of repeat customers (> 1 paid order), and returning customer rate percentage.

      Validations enforced:
      - `startDate` and `endDate` are required.
      - `endDate` must be greater than or equal to `startDate`.
      - Date range cannot exceed 1 year.

    parameters:
      - name: startDate
        in: query
        required: true
        description: Start date (YYYY-MM-DD).
        schema:
          type: string
          format: date
        example: "2026-01-01"

      - name: endDate
        in: query
        required: true
        description: End date (YYYY-MM-DD, within 1 year from startDate).
        schema:
          type: string
          format: date
        example: "2026-10-01"

    responses:
      "200":
        description: Customer analytics retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/CustomerAnalyticsResponse"
            example:
              status: "success"
              data:
                userAnalytics:
                  - month: "2026-01"
                    totalUsers: 15
                  - month: "2026-02"
                    totalUsers: 28
                topPayingCustomers:
                  - customerId: "664b1f89e21b8c12a8901234"
                    totalOrders: 12
                    totalMoneySpent: 5400
                  - customerId: "664b1f89e21b8c12a8905678"
                    totalOrders: 8
                    totalMoneySpent: 4100
                returningCustomers:
                  - totalCustomers: 120
                    returningCustomers: 35
                    returningCustomersRate: 29.17

      "400":
        description: Validation error in date parameters.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            examples:
              missingDates:
                summary: Missing date parameters
                value:
                  status: "Error"
                  message: "Start date and end date are required"
              rangeExceeded:
                summary: Range exceeds one year
                value:
                  status: "Error"
                  message: "The date range cannot exceed one year"

      "401":
        description: Authentication token missing or invalid.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Please login to access this page"

      "403":
        description: Authenticated user does not have administrator privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "you are not allowed to perform this action"

# ============================================================
# 13. PAYMENT ANALYTICS
# ============================================================
paymentAnalytics:
  get:
    operationId: getPaymentAnalytics
    security:
      - bearerAuth: []
    tags:
      - admin

    summary: Get payment success/failure volumes, amounts, and conversion rates

    description: |
      Analyzes transaction history and financial performance across payment statuses:
      - `paymentStatusAnalytics`: Volume counts and financial amounts partitioned into successful (`paid`), failed (`failed`), and refunded (`cancelled`) categories.
      - `paymentStatusRate`: Total payment attempts, success rate percentage, and failure rate percentage rounded to two decimal places.

    responses:
      "200":
        description: Payment analytics retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/PaymentAnalyticsResponse"
            example:
              status: "success"
              data:
                paymentStatusAnalytics:
                  - successfullPayments: 180
                    successfullAmounts: 81000
                    failedPayments: 12
                    failedAmounts: 5400
                    refundedPayments: 5
                    refundedAmounts: 2250
                paymentStatusRate:
                  - successfullPayments: 185
                    failedPayments: 12
                    totalPayments: 197
                    successRate: 93.91
                    failedRate: 6.09

      "401":
        description: Authentication token missing or invalid.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Please login to access this page"

      "403":
        description: Authenticated user does not have administrator privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "you are not allowed to perform this action"

# ============================================================
# 14. DEACTIVATE USER
# ============================================================
deactivateUser:
  get:
    operationId: deactivateUser
    security:
      - bearerAuth: []
    tags:
      - admin

    summary: Suspend / deactivate a user account

    description: |
      Deactivates a user account by setting `isActive: false`.

      The target user is identified by the `userId` parameter.
      The updated user record is returned without password credentials.

      Rate limit: 30 requests per minute.

    parameters:
      - name: userId
        in: path
        required: true
        description: MongoDB ObjectId of the user to deactivate.
        schema:
          type: string
        example: "683aa9c34ae6c56e60594eb2"

    responses:
      "200":
        description: User account suspended successfully.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/DeactivateUserResponse"
            example:
              status: "success"
              message: "User is suspended"
              data:
                _id: "683aa9c34ae6c56e60594eb2"
                name: "John Doe"
                email: "johndoe@example.com"
                isEmailVerified: true
                role: "user"
                dateOfBirth: "2000-01-15T00:00:00.000Z"
                phoneNumber: 1234567890
                gender: "male"
                isActive: false
                totalOrderes: 3
                totalSpent: 1250
                cart: []
                faviourites: []
                createdAt: "2025-05-31T07:03:31.815Z"
                updatedAt: "2026-10-02T12:00:00.000Z"

      "401":
        description: Authentication token missing or invalid.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Please login to access this page"

      "403":
        description: Authenticated user does not have administrator privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "you are not allowed to perform this action"

      "404":
        description: User ID not provided or user not found.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            examples:
              userNotFound:
                summary: User not found
                value:
                  status: "Error"
                  message: "User not found"
              idNotFound:
                summary: User ID missing
                value:
                  status: "Error"
                  message: "User id not found"

      "429":
        description: Rate limit exceeded (30 requests per minute).
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Too many requests. Please try again later"
