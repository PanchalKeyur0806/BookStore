bookAnalytics:
  get:
    operationId: getBookAnalytics
    security:
      - bearerAuth: []
    tags:
      - admin

    summary: Get book catalog, sales, and review analytics

    description: |
      Returns three comprehensive analytical datasets across the bookstore:

      1. `booksAnalytic`: Total books, active books, inactive/deleted books, out-of-stock books, and low-stock books (< 100 units).
      2. `bookSaleAnalytics`: Top 10 best-selling books and top 10 low-selling books based on quantity sold in paid orders.
      3. `bookReviewAnalytics`: Top 10 most-rated books and top 10 highest-rated books (by average rating).

    responses:
      "200":
        description: Book catalog analytics retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/BookAnalyticsResponse"
            example:
              stauts: "success"
              data:
                booksAnalytic:
                  - total: 150
                    totalActiveBooks: 142
                    totalInactiveBooks: 8
                    outOfStockBooks: 4
                    lowStockBooks: 19
                bookSaleAnalytics:
                  - bestSellingBooks:
                      - _id: "664b1f89e21b8c12a8901234"
                        totalSold: 120
                        totalOrders: 65
                        book:
                          - _id: "664b1f89e21b8c12a8901234"
                            title: "Clean Code"
                            price: 450
                            category: "Action"
                    lowSellingBooks:
                      - _id: "664b1f89e21b8c12a8909876"
                        totalSold: 1
                        totalOrders: 1
                        book:
                          - _id: "664b1f89e21b8c12a8909876"
                            title: "Cobol Programming in Depth"
                            price: 320
                            category: "Biography"
                bookReviewAnalytics:
                  - mostRatedBook:
                      - bookId: "664b1f89e21b8c12a8901234"
                        totalRating: 250
                        reviewCount: 55
                        avgRating: 4.55
                    highestRatedBook:
                      - bookId: "664b1f89e21b8c12a8905555"
                        totalRating: 98
                        reviewCount: 20
                        avgRating: 4.90

      "401":
        description: Authentication token missing or invalid.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Please login to access this page"

      "403":
        description: Authenticated user does not have administrator privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "you are not allowed to perform this action"

# ============================================================
# 4. DEAD MOVING STOCKS
# ============================================================
deadMovingStocks:
  get:
    operationId: getDeadMovingStocks
    security:
      - bearerAuth: []
    tags:
      - admin

    summary: Get books with zero sales in the last 30 days

    description: |
      Identifies stagnant inventory ("dead stock") books that have generated zero sales
      in paid orders over the past 30 days.

      Returns paginated book items with title, author, current stock, price, and `totalSold: 0`.

    parameters:
      - name: page
        in: query
        required: false
        description: Page number for pagination.
        schema:
          type: integer
          default: 1
          minimum: 1
        example: 1

      - name: limit
        in: query
        required: false
        description: Number of books per page.
        schema:
          type: integer
          default: 2
          minimum: 1
        example: 10

    responses:
      "200":
        description: Dead stock inventory retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/DeadStockResponse"
            example:
              status: "success"
              pagination:
                totalItems: 8
                totalPages: 4
                currentPage: 1
                hasNextPage: true
              data:
                - _id: "664b1f89e21b8c12a8901234"
                  title: "Legacy Fortran Architecture"
                  stock: 35
                  author: "Walter Smith"
                  price: 45
                  totalSold: 0
                - _id: "664b1f89e21b8c12a8905678"
                  title: "Ancient Assembly Language"
                  stock: 12
                  author: "Alan Turing"
                  price: 60
                  totalSold: 0

      "401":
        description: Authentication token missing or invalid.
        content:
