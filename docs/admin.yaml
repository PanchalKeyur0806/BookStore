# ============================================================
# 7. CATEGORY SALES TREND
# ============================================================
categorySalesTrend:
  get:
    operationId: getCategorySalesTrend
    security:
      - bearerAuth: []
    tags:
      - admin

    summary: Get month-by-month sales trends per category

    description: |
      Computes monthly sales quantities and revenue per category within a specified date range.

      Validations enforced:
      - `startDate` and `endDate` are required valid date strings.
      - `endDate` must be strictly after `startDate`.
      - The date range between `startDate` and `endDate` cannot exceed 1 year.

      Missing calendar months in the range are automatically densified with zero values.

    parameters:
      - name: startDate
        in: query
        required: true
        description: Start date in YYYY-MM-DD format.
        schema:
          type: string
          format: date
        example: "2026-01-01"

      - name: endDate
        in: query
        required: true
        description: End date in YYYY-MM-DD format (must be within 1 year from startDate).
        schema:
          type: string
          format: date
        example: "2026-09-01"

    responses:
      "200":
        description: Category sales trends retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/CategoryTrendResponse"
            example:
              status: "success"
              data:
                - year: "2026-01"
                  category: "Fantasy"
                  totalQuantity: 25
                  totalRevenue: 12500
                - year: "2026-02"
                  category: "Action"
                  totalQuantity: 18
                  totalRevenue: 9000

      "400":
        description: Validation error in date parameters (e.g. missing dates, invalid format, end <= start, or range > 1 year).
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            examples:
              missingDates:
                summary: Missing date parameters
                value:
                  status: "Error"
                  message: "Please enter start and end date"
              invalidRange:
                summary: Range exceeds one year
                value:
                  status: "Error"
                  message: "Date range cannot be more than 1 year"

      "401":
        description: Authentication token missing or invalid.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Please login to access this page"

      "403":
        description: Authenticated user does not have administrator privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "you are not allowed to perform this action"

