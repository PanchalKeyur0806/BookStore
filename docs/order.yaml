


checkoutSession:
  post:
    operationId: checkoutsession
    security:
      - bearerAuth: []
    tags:
      - orders

    summary: Create a checkout session for the authenticated user's cart

    description: |
      Creates a Stripe checkout session for the authenticated customer's shopping cart.

      This endpoint requires authentication and is restricted to customers with
      `role: 'user'`. The user's email address must be verified.

      The checkout session is created using the Stripe SDK and includes the items in the user's cart.

    responses:

      "401":
        description: Missing or invalid JWT authentication token.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            examples:
              missingToken:
                summary: Bearer token omitted
                value:
                  status: "Error"
                  message: "Token not found please register first"

              invalidToken:
                summary: Token invalid or expired
                value:
                  status: "Error"
                  message: "Please login to access this page"

      "403":
        description: Authenticated user is unverified or lacks customer privileges.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            examples:
              nonUserRole:
                summary: User does not hold customer role (role != 'user')
                value:
                  status: "Error"
                  message: "you are not allowed to perform this action"

              unverifiedAccount:
                summary: User account email is not verified
                value:
                  status: "Error"
                  message: "you are not verified, please verified first then try again"

      "429":
        description: Rate limit exceeded (30 requests per minute).
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Too many requests. Please try again later"

      "500":
        description: Internal server error or Stripe connection failure.
        content:
          application/json:
            schema:
              $ref: "./schema.yaml#/components/schemas/ErrorResponse"
            example:
              status: "Error"
              message: "Internal Server Error"

