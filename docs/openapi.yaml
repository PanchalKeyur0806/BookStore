openapi: 3.1.0

info:
  title: BookStore REST API
  version: 1.0.0
  description: |
    REST API for an online bookstore.

    This API provides authentication, user management, book management,
    cart, favourites, orders, and other bookstore-related functionality.
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"

servers:
  - url: http://bookstore.kplabs.com/api
    description: Local Development Server

tags:
  - name: auth
    description: |
      Authentication and account verification endpoints.

      Includes:
      - User registration
      - User login
      - Email OTP verification
      - Resending OTP
      - Forgot password
      - Reset password
  - name: admin
    description: |
      Administrator endpoints for monitoring and managing
      the bookstore application.
  - name: books
    description: |
      Book catalog, inventory, and product management endpoints.

      Includes:
      - Public catalog browsing with title and author regex search
      - Sorting (newest, oldest) and pagination controls
      - Single book lookup with high-speed Redis caching
      - Administrator book creation with Cloudinary cover image upload
      - Administrator book updates with metadata editing and cover image replacement
      - Administrator soft-deletion preserving historical order data
  - name: cart
    description: |
      Shopping cart operations for authenticated customers.

      Includes:
      - Retrieving active user shopping cart with Redis caching
      - Adding books to cart with real-time inventory validation and dynamic pricing recalculation
      - Removing items from cart with automatic price and quantity reconciliation
  - name: orders
    description: |
      Order processing, Stripe checkout, refund requests, and fulfillment tracking.

      Includes:
      - Creating Stripe checkout sessions with inventory reservations and cart conversion
      - Processing customer payment refunds with eligibility verification (7-day window)
      - Administrator platform-wide order monitoring, sorting, and pagination
      - Single order lookup with high-speed Redis caching
      - Stripe payment completion and redirection handling

  - name: reviews
    description: |
      Customer book review and rating management endpoints.

      Includes:
      - Retrieving paginated customer reviews and star ratings for a specific book
      - Submitting customer reviews with automatic book aggregate rating recalculation
      - Updating user reviews and modifying star ratings
      - Deleting customer reviews with automated catalog score reconciliation
      - Administrator catalog-wide review monitoring, searching, and pagination
      - High-performance personal review retrieval with Redis cache-aside caching

  - name: users
    description: |
      User account management, profile settings, order history, and favourites collection.

      Includes:
      - Retrieving authenticated customer profile (`/users/me`)
      - Updating user account information and delivery address (`/users/updateMe`)
      - Retrieving past order history (`/users/orders`)
      - Managing book favourites and wishlist items (`/users/favBooks`)
      - Administrator user catalog querying with multi-field regex filters and pagination (`/users/all`)
      - Administrator single user lookup by ID (`/users/{userId}`)

  - name: wishlist
    description: |
      Customer book wishlist and saved items management endpoints.

      Includes:
      - Retrieving all saved books in customer's wishlist with populated book catalog details (`/wishlist`)
      - Adding books to personal wishlist with real-time catalog existence and duplicate validation (`/wishlist/{bookId}`)
      - Removing books from customer wishlist (`/wishlist/{bookId}`)




