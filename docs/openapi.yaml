  /admin/customer/analytics:
    $ref: "./admin.yaml#/customerAnalytics"

  /admin/payment/analytics:
    $ref: "./admin.yaml#/paymentAnalytics"

  /admin/deactivateUser/{userId}:
    $ref: "./admin.yaml#/deactivateUser"

  # ============================================================
  # BOOK ROUTES
  # ============================================================

  /books:
    $ref: "./book.yaml#/books"

  /books/{bookId}:
    $ref: "./book.yaml#/bookById"

  # ============================================================
  # CART ROUTES
  # ============================================================

  /cart:
    $ref: "./cart.yaml#/cart"

  /cart/add:
    $ref: "./cart.yaml#/addToCart"

  /cart/remove/{bookId}:
    $ref: "./cart.yaml#/removeBookFromCart"

  # ============================================================
  # ORDER ROUTES
  # ============================================================

  /orders/checkout-session:
    $ref: "./order.yaml#/checkoutSession"
  
