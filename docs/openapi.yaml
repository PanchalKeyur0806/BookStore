    $ref: "./order.yaml#/refundPayments"

  /orders/all:
    $ref: "./order.yaml#/getAllOrders"

  /orders/order/{orderId}:
    $ref: "./order.yaml#/getOneOrder"

  /orders/success:
    $ref: "./order.yaml#/success"

  # ============================================================
  # REVIEW ROUTES
  # ============================================================

  /books/{bookId}/review:
    $ref: "./review.yaml#/bookReviews"

  /reviews/all:
    $ref: "./review.yaml#/getAllReviews"

  /reviews/{bookId}/me:
    $ref: "./review.yaml#/getMyReview"

  # ============================================================
  # USER ROUTES
  # ============================================================

  /users/me:
    $ref: "./user.yaml#/me"

  /users/updateMe:
    $ref: "./user.yaml#/updateMe"

  /users/orders:
    $ref: "./user.yaml#/userOrders"

  /users/favBooks:
    $ref: "./user.yaml#/favBooks"

  /users/all:
    $ref: "./user.yaml#/allUsers"

  /users/{userId}:
    $ref: "./user.yaml#/userById"

  # ============================================================
  # WISHLIST ROUTES
  # ============================================================

  /wishlist:
    $ref: "./wishlist.yaml#/wishlist"

  /wishlist/{bookId}:
    $ref: "./wishlist.yaml#/wishlistByBookId"




